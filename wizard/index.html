/* Что выбрано на экране снятия: не выбирали — «Выключить VPN», обратимое. */
function rmWay(){ return ST.pick.rm === 'purge' ? 'purge' : 'off'; }
/* РЯД КНОПОК СНЯТИЯ: главная — красная и называет выбранное («Выключить VPN» / «Удалить полностью»), полное удаление
   заперто галочкой `sure` (`data-need`). До 8b действие висело на самой карточке — касание плитки и было удалением. */
function rmActs(){
  var a = document.getElementById('acts');
  if (!a) return;
  var full = rmWay() === 'purge';
  actsSet('<button class="btn gh" data-go="exists" data-bk="1">' + T('Назад', 'Back') + '</button>' + SP +
    '<button class="btn bad" data-act="rmgo"' + (full ? ' data-need="sure"' : '') + '>' +
    (full ? T('Удалить полностью', 'Remove everything') : T('Выключить VPN', 'Switch VPN off')) + '</button>');
  syncNeed();
}

/* ─── рендер и действия ─────────────────────────────────────────────────────── */
function render(id){
  var s = S[id] || S.welcome;
  CUR = s.id;
  RENDER_SEQ++;
  /* ВХОД НА ЭКРАН (не перерисовка сменой языка) — с чистого листа: выбор на плитках и галочки экрана (`picks`) и
     черновики его полей. Прошлый заход не решает за этот: черновик ошибочной попытки пароля подставлялся в поле на
     следующем заходе под подсказкой «тот, что задали» (ревью шага 8b, круг 2). */
  if (!REPAINT){
    ST.said = null;
    (s.picks || []).forEach(function(k){ delete ST.pick[k]; });
    Object.keys(ST.draft).forEach(function(k){ if (k.indexOf(s.id + ':') === 0) delete ST.draft[k]; });
  }
  /* Заставка вне счёта шагов: она ещё не установка, а вход в неё. Полоску там не рисуем
     вовсе — пустой степпер над знаком читался бы как «шаг 0 из 4». */
  /* Шаг — кружок с номером, пройденный — галочкой, текущий назван и для читалки (`aria-current`). */
  var step = typeof s.step === 'function' ? s.step() : s.step;
  document.getElementById('wz-steps').innerHTML = step < 0 ? '' : STEPS().map(function(t, i){
    return '<div class="wzst' + (i === step ? ' on' : (i < step ? ' done' : '')) + '"' +
      (i === step ? ' aria-current="step"' : '') + '><i aria-hidden="true">' + (i < step ? '✓' : (i + 1)) + '</i>' + t + '</div>'; }).join('');
  /* Карточка шага — `.card` панели; у заставки (`bare`) заголовка и кнопок нет, только тело. Ряд кнопок —
     `.acts` панели: последняя из нескольких и одиночная ГЛАВНАЯ прижаты вправо (главное действие — справа), а
     одиночная «Назад» стоит слева — и не прыгает туда, когда роутер ответит и ряд пополнится (ревью шага 8b).
     Заголовок принимает фокус программно (`tabindex=-1`): после смены экрана фокус с выброшенной кнопки уходил в
     BODY, и читалка не говорила, куда человек попал. */
  document.getElementById('wz-view').innerHTML = '<div class="card wzcard">' + (s.bare ? s.body() :
    '<h1 class="bh1 wzh1" tabindex="-1">' + s.t() + '</h1>' + (s.sub ? '<div class="bsub">' + s.sub() + '</div>' : '') +
    '<div class="wzbody">' + s.body() + '</div>' +
    '<div class="acts wzacts" id="acts">' + (s.acts || []).map(function(a, i){
      return (i === (s.acts.length - 1) && (s.acts.length > 1 || a.k === 'pri') ? SP : '') +
        '<button class="btn ' + (a.k || '') + '"' + (a.go ? ' data-go="' + a.go + '"' : '') + (a.bk ? ' data-bk="1"' : '') +
        (a.act ? ' data-act="' + a.act + '"' : '') + (a.need ? ' data-need="' + a.need + '" disabled' : '') +
        '>' + a.t() + '</button>'; }).join('') + '</div>') + '</div>';
  paintLang();
  /* Счётчик растёт ТОЛЬКО когда адрес правда меняется: присвоение того же хеша события не даёт,
     и «съеденным» оказался бы СЛЕДУЮЩИЙ — то есть настоящее «назад» человека. */
  if (location.hash !== '#' + id){ HASH_SELF++; location.hash = id; }
  /* Сначала РАЗМЕТКА, потом работа с узлами: тянуться к элементу, которого ещё нет в
     документе, — классика (в панели за это уже платили). */
  if (s.enter) s.enter();
  if (REPAINT && ST.said && ST.said.scr === s.id){ var sr = document.getElementById('res'); if (sr) sr.innerHTML = SAID[ST.said.k](ST.said.d); }
  syncNeed();
  /* Фокус — на заголовок нового экрана, если вход экрана не поставил его сам (поле пароля) и это не перерисовка
     сменой языка (там фокус остаётся на переключателе). */
  if (!REPAINT){
    var fa = document.activeElement, h = document.querySelector('#wz-view h1');
    if (h && (!fa || fa === document.body || !document.body.contains(fa))) h.focus();
  }
}
function go(id){ render(id); }

/* КНОПКА «НАЗАД» В БРАУЗЕРЕ. Хеш мы пишем как след для отладки — и до 02.09.2026 «назад» его
   МЕНЯЛА, а экран оставался прежним: адрес говорил одно, страница показывала другое, и человек
   видел кнопку, которая «не работает» (поймано на живом прогоне). Чинить «рендером по хешу»
   нельзя — половина экранов на входе ЗАПУСКАЕТ работу (установка, проверка, диагностика), и
   тогда шаг назад стартовал бы задание. Поэтому «назад» делает ровно то же, что кнопка «Назад»
   НА ЭКРАНЕ: уходит туда, куда ведёт она. Нет такой кнопки (заставка, экран задания) — остаёмся
   на месте и возвращаем адрес, чтобы он не врал.

   КНОПКУ ИЩЕМ ПО МЕТКЕ `bk`, А НЕ ПО ВИДУ. Первая редакция брала первую попавшуюся «призрачную»
   (k:'gh') кнопку с переходом — а призрачными нарисованы и «Оставить как есть», и «Пропустить»,
   и «Мастер больше не нужен». ЗАМЕР В БРАУЗЕРЕ 02.09.2026: «назад» на экране пароля root уводила
   ВПЕРЁД, на «Проверку перед установкой», и ЗАПУСКАЛА её задание (POST /api/facts) — ровно то,
   чего этот обработчик и должен был не допустить. Вид — вопрос оформления, направление — вопрос
   смысла; помечаем смысл.

   СВОИ СМЕНЫ АДРЕСА — СЧЁТЧИКОМ, А НЕ ФЛАГОМ. Экран может увести на другой прямо из своего входа (`access-run` без формы
   — обратно к ней): за одну задачу адрес меняется ДВАЖДЫ, событий приходит два, а флаг съедал только первое — второе
   читалось как «назад» человека и уводило на экран раньше (поймано стендом `wizard-ui-test`, шаг 8b). */
var HASH_SELF = 0;
window.addEventListener('hashchange', function(){
  if (HASH_SELF > 0){ HASH_SELF--; return; }
  /* Дорога назад — кнопка «Назад», которая СЕЙЧАС на экране (`data-bk`), а не строка в описании экрана: исход меняет
     ряд, и после удаления «назад» уводил на «Панель уже стоит» с роутером, которого уже нет (ревью шага 8b, круг 2). */
  var back = document.querySelector('#acts [data-bk]');
  if (back && !back.disabled && !JOB_RUN) return render(back.getAttribute('data-go'));
  if (location.hash !== '#' + CUR){ HASH_SELF++; location.hash = CUR; }
});

/* Кнопка с data-need включается галочкой: согласие — не формальность, и обходить его
   нечем. Один обработчик на все экраны, второй копии не заводить. */
function syncNeed(){
  document.querySelectorAll('[data-need]').forEach(function(b){
    var c = document.getElementById(b.getAttribute('data-need'));
    /* `data-blocked` СИЛЬНЕЕ галочки: кнопку могли запретить по другой причине (каталог не
       пишется), и тогда отметка «всё равно пробую» не имеет права её включить. */
    b.disabled = b.hasAttribute('data-blocked') || !(c && c.checked);
  });
}
document.addEventListener('change', function(e){
  if (e.target && e.target.type === 'checkbox') syncNeed();
  /* Форма открытия доступа и согласие про съёмный накопитель живут в сеансе (разбор у ST.acc): экран, который
     перерисовали, возвращает их, а не обнуляет. */
  if (e.target && (e.target.id === 'bak' || e.target.id === 'lang') && CUR === 'access') ST.acc[e.target.id] = e.target.checked;
  /* Галочки согласия — в сеанс (переживают смену языка); вход на экран их сбрасывает (`picks` экрана, см. render). */
  if (e.target && /^(removable|sure|agree|tight)$/.test(e.target.id)) ST.pick[e.target.id] = e.target.checked;
  /* Накопитель выбирают из списка, и от выбора зависит не только «куда переносить», но и что
     мы обещаем про ключи: права доступа — свойство РАЗМЕТКИ, а размечены накопители по-разному.
     Поэтому смена выбора перерисовывает блок целиком (showStore сам вернёт выбранное значение),
     а не подменяет одну строку — второй копии условия «хранит ли ФС права» здесь не заводим. */
  if (e.target && e.target.id === 'storedev' && ST.store){
    ST.storeDev = e.target.value || '';
    showStore(ST.store);
    /* Список перерисован вместе с блоком — фокус обратно на него: иначе вторая стрелка листала страницу. */
    var sd2 = document.getElementById('storedev'); if (sd2) sd2.focus();
  }
});
/* Пароль формы доступа — по `input`, а не по `change`: `change` приходит только при уходе с поля, и перерисовка
   экрана (смена языка) унесла бы набранное до него. */
document.addEventListener('input', function(e){
  var t = e.target;
  if (!t || !t.id) return;
  if (t.id === 'newpw' && CUR === 'access') ST.acc.pw = t.value;
  else if (t.tagName === 'INPUT' && t.type !== 'checkbox') ST.draft[CUR + ':' + t.id] = t.value;
});
/* Плитки, двери и сегменты — узлы с ролью кнопки: Enter и пробел нажимают их так же, как щелчок (у настоящей
   <button> это делает браузер). Один обработчик на все, как `wireSeg` у панели. */
document.addEventListener('keydown', function(e){
  if (e.key !== 'Enter' && e.key !== ' ') return;
  var t = e.target;
  if (!t || !t.getAttribute || t.getAttribute('role') !== 'button' || t.tagName === 'BUTTON') return;
  /* Запертый сегмент (`aria-disabled`) — ни нажатия, ни прокрутки страницы пробелом. */
  e.preventDefault();
  t.click();
});
/* ВЫБОР ПЛИТКИ. Плитка только выбирает (ST.pick) — действие у кнопки ряда, и её подпись и запертость следуют за
   выбором. Пока идёт задание, выбор не меняем: кнопка ряда занята им, а перерисовка её отперла бы. */
function optPick(t){
  if (JOB_OWN[RENDER_SEQ] > 0) return;
  var g = t.getAttribute('data-opt'), v = t.getAttribute('data-v');
  ST.pick[g] = v;
  var box = t.parentNode;
  box.querySelectorAll('[data-opt]').forEach(function(o){
    var on = o === t;
    o.classList.toggle('on', on);
    o.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
  if (g === 'acc'){
    var f = document.getElementById('accform'), b = document.querySelector('#acts [data-act="accgo"]');
    if (f) f.hidden = v !== 'open';
    if (b) b.textContent = v === 'open' ? T('Открыть доступ', 'Open access') : T('Проверить пароль', 'Check the password');
    var r = document.getElementById('res'); if (r) r.innerHTML = '';
  }
  /* Раскладка перерисовывается целиком: цена и согласие показываются только у «всё на накопителе». Фокус — обратно
     на выбранную плитку (её узел заменён). */
  if (g === 'store'){
    showStore(ST.store);
    var nt = document.querySelectorAll('[data-opt="store"]');
    for (var i = 0; i < nt.length; i++) if (nt[i].getAttribute('data-v') === v) nt[i].focus();
  }
  if (g === 'rm') rmActs();
}
/* ДВОЙНОЙ ЩЕЛЧОК СКВОЗЬ СМЕНУ ЭКРАНА. Первый щелчок меняет экран, второй попадает в то, что встало на место кнопки: в
   строку галочки «делаю на свой страх и риск» (она отмечалась, и «Дальше» отпиралась вслепую) или в дверь (задание).
   Второй щелчок серии (`detail >= 2`), если между ним и первым сменился экран, гасим в фазе перехвата — вместе с
   действием по умолчанию (отметкой галочки у <label>). Нажатия с клавиатуры (`detail 0`) не трогаем. */
var CLICK_SEQ = -1;
document.addEventListener('click', function(e){
  if (e.detail === 1) CLICK_SEQ = RENDER_SEQ;
  else if (e.detail >= 2 && CLICK_SEQ !== RENDER_SEQ){ e.preventDefault(); e.stopPropagation(); }
}, true);
document.addEventListener('click', function(e){
  if (e.defaultPrevented) return;
  /* Кнопка-глаз живёт ВНУТРИ <label>: клик по ней не должен уходить в общий разбор
     действий, а фокус после переключения возвращаем в поле — иначе человек допечатывает
     пароль в пустоту. */
  var ey = e.target.closest('[data-eye]');
  if (ey) {
    var inp = document.getElementById(ey.getAttribute('data-eye'));
    if (inp) {
      var show = inp.type === 'password';
      inp.type = show ? 'text' : 'password';
      ey.classList.toggle('off', show);
      var lb = show ? T('Скрыть пароль', 'Hide password') : T('Показать пароль', 'Show password');
      ey.setAttribute('aria-label', lb);
      ey.setAttribute('title', lb);
      inp.focus();
      try { inp.setSelectionRange(inp.value.length, inp.value.length); } catch (err) {}
    }
    return;
  }
  var lg = e.target.closest('[data-lang]');
  if (lg){ if (!lg.classList.contains('dis')) setLang(lg.getAttribute('data-lang')); return; }
  var th = e.target.closest('[data-theme-set]');
  if (th){ applyTheme(th.getAttribute('data-theme-set')); return; }
  var op = e.target.closest('[data-opt]');
  if (op){ optPick(op); return; }
  var n = e.target.closest('[data-act],[data-go]');
  if (!n || n.disabled) return;
  var a = n.getAttribute('data-act');
  if (a) return act(a, n);
  go(n.getAttribute('data-go'));
});

/* ПОКА ИДЁТ ДЕЙСТВИЕ — РЯД ЗАПЕРТ ЦЕЛИКОМ: «Назад» посреди «Задаю…» уводил с экрана, и итог смены пароля панели было уже
   не узнать, а «Оставить как есть» посреди «Меняю…» — пароль root менялся молча (ревью шага 8b, круг 3). Запертые нами
   помечены `data-lock` и отпираются `unbusy`; новое действие снимает и прошлый исход экрана (`ST.said`). */
/* РЯД КНОПОК ПОСЛЕ ДЕЙСТВИЯ — ОДНИМ ХУДОЖНИКОМ. Ряд пересобирается исходом, и фокус с нажатой кнопки уходил в BODY
   (клавиатура начинала путь по странице сначала) — после пробы, пароля панели, снятия (ревью шага 8b, круг 3). Был в
   ряду — встаёт на главную кнопку нового; ряд опустел на время работы — вернётся, когда ряд появится. */
var ACTS_LOST = -1;
function actsSet(h){
  var a = document.getElementById('acts');
  if (!a) return;
  var f = document.activeElement;
  var had = !!(f && f !== document.body && a.contains(f)) || (ACTS_LOST === RENDER_SEQ && (!f || f === document.body));
  a.innerHTML = h;
  ACTS_LOST = -1;
  if (!had) return;
  var bs = a.querySelectorAll('button'), p = null;
  for (var i = 0; i < bs.length; i++) if (!bs[i].disabled && (!p || (bs[i].classList.contains('pri') && !p.classList.contains('pri')))) p = bs[i];
  if (p) p.focus(); else ACTS_LOST = RENDER_SEQ;
}
function busy(node, text){
  if (!node || node.dataset.old) return;
  ST.said = null;
  /* Запертая кнопка отдаёт фокус BODY — ряд, пересобранный исходом, вернёт его на свою главную (`actsSet`). */
  var ac = document.getElementById('acts');
  if (document.activeElement === node && ac && ac.contains(node)) ACTS_LOST = RENDER_SEQ;
  node.disabled = true;
  node.dataset.old = node.textContent;
  node.textContent = text || T('Минуту…', 'One moment…');
  document.querySelectorAll('#acts button').forEach(function(b){
    if (b !== node && !b.disabled){ b.disabled = true; b.setAttribute('data-lock', '1'); }
  });
}
function unbusy(node){
  if (!node) return;
  node.disabled = false;   /* безусловно: иначе кнопка без сохранённого текста остаётся мёртвой */
  if (node.dataset.old){ node.textContent = node.dataset.old; delete node.dataset.old; }
  document.querySelectorAll('#acts [data-lock]').forEach(function(b){ b.disabled = false; b.removeAttribute('data-lock'); });
  syncNeed();
  /* Запертая кнопка теряет фокус (браузер отдаёт его BODY) — вернуть, если он так там и лежит: клавиатура иначе
     начинала путь по странице сначала после каждого отказа. */
  var fa = document.activeElement;
  if (node.parentNode && document.body.contains(node) && (!fa || fa === document.body)){ node.focus(); ACTS_LOST = -1; }
}

/* Строки задания открытия доступа: полоску шагов ведёт агент маркерами ::STEP:: (он один знает, что сейчас
   крутит); эти строки в лог не пускаем — всё прочее уходит как есть. ОДИН разбор на `access-run` и `resume`:
   после F5 посреди открытия маркеры падали в лог сырыми строками (ревью шага 8b). `steps()` — сколько шагов
   агент объявил (отказ до первого шага полоску не держит). */
function stepFeed(stepsEl, log){
  var order = [], state = {};
  var f = function(lines){
    /* Маркеры разбираем СТРОГО по формату: что не подошло — уходит в лог как обычная строка
       (иначе вывод патчера, случайно начавшийся с «::», сожрёт лог или подделает шаг).
       Рисуем ОДИН раз за батч, а не на каждый маркер. */
    var plain = [], m, dirty = false;
    lines.forEach(function(s){
      if ((m = /^::STEPS::(.*)$/.exec(s))){ order = m[1] ? m[1].split(',') : []; state = {}; dirty = true; }
      else if ((m = /^::STEP::([a-z]+)::(run|ok|fail|wait)$/.exec(s))){ state[m[1]] = m[2]; dirty = true; }
      else plain.push(s);
    });
    if (dirty) stepsRender(stepsEl, order, state);
    if (plain.length) logPush(log, plain);
  };
  f.steps = function(){ return order.length; };
  return f;
}
/* Какой пароль root спрашивать после открытия доступа — по ответу агента: задан наш (`pw_set`), сменить не вышло и
   сейчас заводской (`pw_why: failed`) или доступ открывали раньше и пароль прежний. Один разбор на экран задания и F5. */
function accPwWhy(r){ return r.pw_set ? 'access' : (r.pw_why === 'failed' ? 'defroot' : 'kept'); }
/* ОТКРЫТИЕ ДОСТУПА — задание экрана `access-run`. Значения формы берём из сеанса (ST.acc): их набирали на экране
   «Доступ», и сюда без пароля не попасть (гард у `accgo`). */
function accessRun(){
  var res = document.getElementById('res'), log = document.getElementById('wzlog'),
      stepsEl = document.getElementById('accsteps'), acts = document.getElementById('acts');
  /* Сюда пришли без формы (её гард — у «Открыть доступ» на экране «Доступ»): задание не стартуем, отправляем к ней. */
  if (!ST.acc.pw) return go('access');
  var body = {ip: ST.ip, backup: ST.acc.bak !== false, lang: !!ST.acc.lang, rootpw: ST.acc.pw};
  /* Пока идёт — кнопок нет: уходить некуда, работа уже на роутере. */
  actsSet('');
  stepsEl.innerHTML = Rows([{mk: 'run', t: T('Запускаю…', 'Starting…'),
                             d: T('жду первый шаг', 'waiting for the first step')}]);
  var feed = stepFeed(stepsEl, log);
  return runJob('/api/access', body, feed).then(function(r){
    if (r.gone) return;
    if (r.ok){
      /* Порт открыт — факт задания; пробы после F5 нет, и выдумывать её нельзя: поиск роутера нарисовал бы «никто не
         отвечает» при открытом SSH (ревью шага 8b, круг 3). */
      if (ST.probe) ST.probe.ssh = true;
      /* Пароль сделал своё — в памяти вкладки ему больше делать нечего. */
      ST.acc.pw = '';
      /* Какой пароль спрашивать дальше — знает ТОЛЬКО агент, и он же говорит (`pw_set`).
         Утилита пароль со stdin не читает: после неё на роутере `root`, и меняет его на
         введённый уже агент — но лишь там, где утилита доступ и открывала. На роутере, где
         SSH был открыт РАНЬШЕ, менять нечего и нечем, пароль остаётся прежним. Подсказка
         «тот, который вы задали» во втором случае отправила бы вводить несуществующий —
         ровно тот тупик, который замерен на AX3600 31.08.2026. */
      ST.pwAsked = true; ST.pwWhy = accPwWhy(r);
      /* Успех С ОГОВОРКОЙ — отдельная строка, а не молчание: необязательный шаг (перевод
         интерфейса) мог не встать, и человек ВИДИТ это в полоске шагов. Не объяснить —
         значит оставить его гадать, доступ открылся или нет. */
      /* Формулировка НЕ считает шаги («один шаг…»): агент отдаёт оговорки СПИСКОМ, и стоит
         появиться второму необязательному шагу — заголовок начал бы врать числом. */
      res.innerHTML = Rows([{mk: 'ok', t: T('Доступ открыт', 'Access is open'),
        d: T('постоянный SSH включён', 'permanent SSH is enabled'), v: '22/tcp'},
        r.warn ? {mk: 'wr', t: T('Не всё встало', 'Not everything was set up'), d: esc(r.warn),
                  v: T('необязательное', 'optional')} : null]);
      actsSet(SP + '<button class="btn pri" data-go="login">' + T('Дальше · пароль root', 'Continue · root password') + '</button>');
    } else {
      /* Отказ ДО первого шага (форма пароля проверяется агентом раньше запуска утилиты) —
         полоска так и осталась бы на «Запускаю… жду первый шаг», то есть рядом с красным
         «доступ не открылся» висело бы бодрое «идёт». Шагов не было — и строки быть не должно. */
      if (!feed.steps() && stepsEl) stepsEl.innerHTML = '';
      res.innerHTML = Rows([{mk: 'no', t: T('Доступ не открылся', 'Access was not opened'),
        d: esc(r.error || T('смотрите вывод ниже', 'see the output below')),
        v: {connect: T('подключение', 'connection'), backup: T('бэкап', 'backup'), ssh: 'SSH',
            lang: T('перевод', 'translation'), verify: T('проверка', 'verification'),
            /* Единственная стадия, на которой прошивку ещё НЕ ТРОГАЛИ: форму пароля агент
               проверяет до первого шага (правило одно с панелью, второй копии в браузере
               не заводим). Назвать её обязательно — иначе отказ читается как поломка. */
            rootpw: T('пароль', 'password')}[r.stage] || ''}]);
      /* «Назад» — к форме со всем набранным (поправить пароль), «Повторить» — те же значения: шаги идемпотентны.
         Отказ ПО ФОРМЕ пароля (`rootpw`) детерминирован: повтор с тем же паролем — тот же отказ по кругу. Там главная —
         «Назад» к форме, а повтора нет (ревью шага 8b). */
      var fixPw = r.stage === 'rootpw';
      actsSet('<button class="btn ' + (fixPw ? 'pri' : 'gh') + '" data-go="access" data-bk="1">' + T('Назад', 'Back') + '</button>' + SP +
        (fixPw ? '' : '<button class="btn pri" data-act="reaccess">' + T('Повторить', 'Try again') + '</button>'));
    }
  }).catch(function(e){
    /* Оборвалась связь С АГЕНТОМ — утилита могла продолжить. */
    res.innerHTML = Note(lostTxt(e) + T('. Утилита могла продолжить — проверьте порт 22, прежде чем повторять.',
        '. The tool may have carried on — check port 22 before retrying.'), 'bad');
    actsSet('<button class="btn gh" data-act="reprobe">' + T('Проверить порт', 'Check the port') +
      '</button>' + SP +
      '<button class="btn" data-go="access" data-bk="1">' + T('Назад', 'Back') + '</button>');
  });
}

/* ИСХОД НЕУДАЧНОГО ВХОДА — одним художником на ответ и на смену языка (`ST.connErr`). Три исхода разведены СЕРВЕРОМ, и
   здесь мы их не сливаем: «не отвечает» лечится адресом и доступом, «пароль не подошёл» — паролем. */
/* ИСХОД ДЕЙСТВИЯ В `#res` — ПРИЧИНОЙ В СЕАНС, текст при отрисовке (`say`): смена языка перерисовывает экран, и отказ
   пробы, пароля root, пароля панели, диагностики, «Оставить прежний пароль», предупреждения форм пропадал — экран
   возвращался к исходному (ревью шага 8b, круг 3; круг 2 закрыл это для проверки, среза, плана и входа). Вход на экран
   и новое действие (`busy`) исход снимают. */
var SAID = {
  fail: function(d){ return Note(failTxt(d.pre ? T(d.pre[0], d.pre[1]) : '', d.e), 'bad'); },
  probe: function(d){ return Note(failTxt(T('Не смог проверить: ', 'Could not check: '), d.e), 'bad'); },
  store: function(d){ return Note(failTxt(T('Не смог спросить роутер: ', 'Could not ask the router: '), d.e), 'bad'); },
  refused: function(d){ return '<div class="wzgap">' + Note(esc(d.error || '') || {
      rootpw: T('Сменить пароль не вышло', 'Changing the password did not work'),
      panelpw: T('Панель пароль не подтвердила', 'The panel did not accept the password'),
      diag: T('Отчёт не собрался', 'The report was not collected')}[d.what], 'bad') + '</div>' +
    (d.what === 'rootpw' ? '<div class="wzgap">' + Note(T(
      'Это не мешает установке: можно продолжить со старым паролем и сменить его позже.',
      'This does not block the installation: you can continue with the old password and change it later.'), 'info') + '</div>' : ''); },
  mismatch: function(){ return Note(T('Пароли не совпадают — наберите заново.', 'The passwords do not match — type them again.'), 'warn'); },
  nopw: function(){ return Note(T('Задайте новый пароль root — иначе после открытия доступа войти будет нечем.',
    'Set a new root password — otherwise there will be nothing to sign in with once access is open.'), 'warn'); }
};
function say(k, d){
  ST.said = {scr: CUR, k: k, d: d || {}};
  var r = document.getElementById('res');
  if (r) r.innerHTML = SAID[k](ST.said.d);
}
/* Отказ входа — ОДНОЙ красной плашкой (макет `wz-login`): жирным — что не вышло и на чём, дальше — причина словами. До
   шага 7 пачки 5 это были строка-факт с ✕ и синяя плашка с советом — два блока про одну беду, причём синий цвет читался
   «всё в порядке». Про сброс пароля говорим ПРЕДПОЛОЖЕНИЕМ: точный ответ («сток зовёт set_user на каждой буте») даёт только
   проба по SSH, а её здесь ещё нет — до входа мы вправе лишь назвать частую причину; текст агента при отказе по паролю не
   нужен (он и есть «пароль не подошёл»), у прочих отказов он и есть причина. `autohint` — молчаливый вход по сохранённому
   паролю не подошёл: та же беда, что и у набранного. */
function connFailHtml(r){
  if (r.kind === 'lost') return Note(failTxt(T('Не смог войти: ', 'Could not sign in: '), {message: r.error, http: r.http}), 'bad');
  if (r.kind === 'net')
    return Note('<b>' + T('Роутер не отвечает по SSH', 'The router does not answer over SSH') + ' · ' + esc(ST.ip) + '.</b> ' +
      T('Доступ ещё не открыт либо адрес не тот. Если доступ ещё не открывали — вернитесь на шаг «Доступ».',
        'Access is not open yet, or the address is wrong. If access has not been opened yet, go back to the “Access” step.'), 'bad');
  var pw = r.kind === 'auth' || r.kind === 'autohint';
  /* Слово после «Вход не удался» — ДЛЯ ЧЕЛОВЕКА: «nopass» и «negotiation» — наши внутренние ярлыки, показывать их нельзя. */
  var what = pw ? T('пароль', 'password')
    : {nopass: T('нет пароля', 'no password'), addr: T('адрес', 'address'),
       negotiation: T('SSH-сессия', 'SSH session')}[r.kind] || T('отказ', 'refused');
  return Note('<b>' + T('Вход не удался', 'Sign-in failed') + ' · ' + what + '.</b> ' +
    /* Отказ входа обязан кончаться ДЕЙСТВИЕМ: у сброшенного пароля (AX3600) текущего человек не знает, и без совета плашка —
       тупик. Заводской пароль знает утилита открытия доступа (ревью пачки 5, круг 1). */
    (pw ? T('Роутер перезагружали? На части моделей Xiaomi сток возвращает пароль root к заводскому на КАЖДОЙ загрузке — ' +
            'сохранённый после этого не подходит. Заводской пароль знает утилита открытия доступа: вернитесь на шаг «Доступ» ' +
            'и откройте его заново.',
            'Was the router rebooted? On some Xiaomi models the stock firmware resets the root password to the factory one ' +
            'on EVERY boot, and the saved one stops working after that. The access tool knows the factory password: go back ' +
            'to the “Access” step and open access again.')
        : esc(r.error || '')), 'bad');
}
function act(name, node){
  /* Кнопка занята — действие уже идёт. Щелчок по запертой до сюда не доходит, а Enter в поле — доходил: два одинаковых
     задания подряд и подпись «Задаю…» навсегда (ревью шага 8b, круг 3). */
  if (node && node.disabled) return;
  var res = document.getElementById('res');
  if (name === 'probe' || name === 'reprobe'){
    /* Проба уже летит (Enter в поле, пока ждём) — вторую параллельно не шлём. */
    if (PROBE_BUSY) return;
    var ip = (document.getElementById('ip') || {}).value || ST.ip;
    ST.ip = ip.trim();
    busy(node, T('Проверяю…', 'Checking…'));
    if (res) res.innerHTML = '<div class="wzgap">' + Rows([{
      mk: 'run', t: T('Проверяю ' + esc(ST.ip) + '…', 'Checking ' + esc(ST.ip) + '…'),
      d: T('жду ответа роутера', 'waiting for the router to answer')}]) + '</div>';
    /* Замок языка — ТОТ ЖЕ, что у заданий (`runJob` ставит его сам). Проба заданием не идёт,
       и без замка смена языка посреди неё перерисовывала экран: ответ приходил в узел, которого
       в документе уже нет, — то есть кнопка «Проверить» отрабатывала вхолостую и молча. */
    jobHold(); PROBE_BUSY = true;
    var unlock = function(){ jobFree(); PROBE_BUSY = false; };
    /* Ответ пробы — ТОЛЬКО экрану, который её начал: без этого ответ, пришедший на «Доступ», заменял его ряд кнопок на
       «Проверить снова / Дальше», а «Проверить порт» с `access-run` уводил с экрана, где человек уже выбирал плитку
       (ревью шага 8b, круг 2). */
    var pseq = RENDER_SEQ;
    return api('/api/probe', {ip: ST.ip}).then(function(p){
      ST.probe = p;
      /* Новый факт порта — выбор на «Доступе» заново по нему, а не по прошлому щелчку. */
      ST.pick.acc = '';
      if (pseq !== RENDER_SEQ) return;
      if (name === 'reprobe') return go(p.ssh ? 'login' : 'access');
      showProbe(p);
    }).catch(function(e){
      /* Отказ — прошлая проба больше не про этот адрес: «Дальше» запирается, пока проба не пройдёт. */
      ST.probe = null;
      if (pseq !== RENDER_SEQ) return;
      say('probe', {e: e});
      var a = document.getElementById('acts');
      if (a && name === 'probe') actsSet(SP + '<button class="btn pri" data-act="probe">' + T('Проверить снова', 'Check again') + '</button>');
    }).then(function(){ unlock(); unbusy(node); });
  }
  if (name === 'accgo'){
    if (accWay() !== 'open') return go('login');
    /* Пустой пароль пропускать нельзя: утилита оставляет роутер с паролем `root`, который
       знает весь интернет, и мастер меняет его СРАЗУ после открытия доступа (это делает
       агент, а не утилита — она пароль со stdin не читает вовсе). Гард как у rootpw/panelpw. */
    if (!ST.acc.pw){ say('nopw'); var np = document.getElementById('newpw'); if (np) np.focus(); return; }
    /* Открытие доступа встроено — уводим на экран с живым логом, задание стартует там. */
    return go('access-run');
  }
  /* Повтор после отказа — тот же экран заново: он и стартует задание, со значениями формы из сеанса. */
  if (name === 'reaccess') return go('access-run');
  if (name === 'connect'){
    var pw = (document.getElementById('pw') || {}).value || '';
    /* Запоминаем ДО запроса: внутри `.then` экран уже мог смениться, а нам важно, вошли мы
       молча (поля не было) или человек пароль вводил — от этого зависит текст отказа. */
    var auto = pwStored();
    busy(node, T('Вхожу…', 'Signing in…'));
    res.innerHTML = '<div class="wzgap">' + Rows([{
      mk: 'run', t: T('Подключаюсь к ' + esc(ST.ip) + '…', 'Connecting to ' + esc(ST.ip) + '…'),
      d: T('проверяю порт и пароль', 'checking the port and the password')}]) + '</div>';
    return runJob('/api/connect', {ip: ST.ip, password: pw}).then(function(r){
      unbusy(node);
      if (r.gone) return;
      ST.conn = r;
      /* «Смените пароль root» говорит «сейчас у роутера пароль по умолчанию» — показываем его, только когда это правда
         (`pw_default`): после доступа, открытого с новым паролем, он звал сменить его второй раз (ревью 8b, круг 3). */
      if (r.ok) return go(r.installed ? 'exists' : (r.pw_default === false ? 'check' : 'rootpw'));
      /* Молчаливый вход не подошёл — ОТКРЫВАЕМ поле. Иначе экран «не спрашиваю» становится
         тупиком: кнопка «Войти» шлёт тот же негодный пароль сколько угодно раз. Перерисовка
         обновляет и `res`, поэтому ссылку берём заново, а не через захваченную выше. */
      if (auto && (r.kind === 'auth' || r.kind === 'nopass')){
        ST.pwAsked = true; ST.pwWhy = 'auth';
        go('login');   /* вход на экран стирает исход прошлой попытки — наш кладём ПОСЛЕ */
        ST.connErr = {kind: 'autohint'};
        var r2 = document.getElementById('res');
        if (r2) r2.innerHTML = connFailHtml(ST.connErr);
        return;
      }
      ST.connErr = r;
      res.innerHTML = connFailHtml(r);
    }).catch(function(e){
      unbusy(node);
      ST.connErr = {kind: 'lost', error: e.message, http: e.http};
      res.innerHTML = connFailHtml(ST.connErr);
    });
  }
  if (name === 'rootpw'){
    var a = (document.getElementById('p1') || {}).value || '', b = (document.getElementById('p2') || {}).value || '';
    if (a !== b) return say('mismatch');
    busy(node, T('Меняю…', 'Changing…'));
    return runJob('/api/rootpw', {password: a}).then(function(r){
      unbusy(node);
      if (r.gone) return;
      if (r.ok) return go('check');   /* черновики полей стирает следующий вход на экран (render) */
      say('refused', {what: 'rootpw', error: r.error});
    }).catch(function(e){ unbusy(node); say('fail', {e: e}); });
  }
  if (name === 'recheck') return go('check');
  if (name === 'install'){
    var t = document.getElementById('tight');
    ST.tight = !!(t && t.checked);
    /* Обновление или установка с нуля — факт проверки; живёт в сеансе и в контексте задания (F5). */
    ST.upd = !!(ST.facts && ST.facts.installed);
    return go('install');
  }
  if (name === 'panelpw'){
    var x = (document.getElementById('p1') || {}).value || '', y = (document.getElementById('p2') || {}).value || '';
    if (x !== y) return say('mismatch');
    busy(node, T('Задаю…', 'Setting…'));
    return runJob('/api/panelpw', {password: x}).then(function(r){
      unbusy(node);
      if (r.gone) return;
      if (r.ok){
        /* Экран «только пароль» остаётся на месте: набранный пароль не должен вернуться в поля сменой языка. */
        delete ST.draft[CUR + ':p1']; delete ST.draft[CUR + ':p2'];
        if (CUR === 'panelpw-only'){
          /* Смена пароля — работа САМА ПО СЕБЕ. Уводить отсюда в «Готово» установки нельзя:
             человек ничего не устанавливал, и экран поздравил бы его с чужим делом. Результат
             показываем НА МЕСТЕ, а дорог оставляем две: назад к списку действий и сразу в
             панель — проверить новый пароль там, где им и пользуются. */
          ST.pwDone = {url: r.url || ''};
          pwDonePaint();
          return;
        }
        /* Экран раскладки существует, ТОЛЬКО когда роутеру есть что предложить: накопитель
           виден и бутстрап назвал текущую раскладку. Спрашивает об этом задание пароля — тем
           же SSH-сеансом, в котором оно и так работало. Иначе экран мигнул бы и увёл дальше
           сам, а мигающий экран читается как сбой. */
        return go(pwNext(r));
      }
      say('refused', {what: 'panelpw', error: r.error});
    }).catch(function(e){ unbusy(node); say('fail', {e: e}); });
  }
  /* «Оставить прежний пароль» (обновление): раскладка — только если роутеру есть что предложить. Спросить об этом
     больше некому — задание пароля не шло, — поэтому срез отдельно, и та же развилка `pwNext`. Прежде кнопка вела на
     экран накопителя всегда: «К роутеру подключён накопитель» над строкой «накопителя не видит» (ревью 8b, круг 3). */
  if (name === 'keeppw'){
    busy(node, T('Спрашиваю роутер…', 'Asking the router…'));
    return runJob('/api/store', {}).then(function(r){
      unbusy(node);
      if (r.gone) return;
      go(pwNext(r));
    }).catch(function(e){ unbusy(node); say('store', {e: e}); });
  }
  if (name === 'storego'){
    var wm = storeSel();
    /* Устройство спрашиваем ТОЛЬКО когда накопителей несколько — тогда на экране есть список.
       Один накопитель отдаём пустой строкой: движок в этом случае сам предпочитает уже
       смонтированную точку, и называть ему устройство значило бы монтировать второй раз. */
    var sel = document.getElementById('storedev');
    ST.storeDev = sel ? (sel.value || '') : '';
    /* Карточка текущей раскладки никуда не переносит: движок ответил бы «режим уже такой»,
       а человек увидел бы экран переезда, на котором ничего не происходит. */
    if (!wm || wm === ((ST.store || {}).mode || '')) return go('done');
    ST.storeMode = wm;
    return go('storerun');
  }
  if (name === 'diag'){
    ST.diagDone = null;
    busy(node, T('Собираю…', 'Collecting…'));
    res.innerHTML = '<div class="wzgap">' + Rows([{
      mk: 'run', t: T('Снимаю состояние роутера…', 'Capturing the router state…'),
      d: T('несколько секунд', 'a few seconds')}]) + '</div>';
    return runJob('/api/diag', {}).then(function(r){
      unbusy(node);
      if (r.gone) return;
      if (!r.ok) return say('refused', {what: 'diag', error: r.error});
      ST.diag = r.path;
      ST.diagDone = {path: r.path, kb: r.kb};
      res.innerHTML = diagHtml(ST.diagDone);
    }).catch(function(e){ unbusy(node); say('fail', {e: e}); });
  }
  if (name === 'openfile'){
    return post('/api/openfile', {path: ST.diag || ''}).catch(function(e){
      if (res) res.insertAdjacentHTML('beforeend',
        '<div class="wzgap">' + Note(T('Не смог открыть файл: ', 'Could not open the file: ') +
          esc(e.message), 'warn') + '</div>');
    });
  }
  if (name === 'bye'){
    busy(node, T('Закрываю…', 'Closing…'));
    /* Посреди задания агент откажет (409): оборванная заливка оставила бы роутер между двумя установками. */
    return post('/api/bye', {}).then(function(){ ENV = {k: 'bye', v: null}; render('bye'); paintChrome(); }).catch(function(e){
      unbusy(node);
      alert(T('Не смог закрыть мастер: ', 'Could not close the wizard: ') + e.message);
    });
  }
  if (name === 'openpanel'){
    return post('/api/openpanel', {}).catch(function(e){
      alert(T('Не смог открыть панель: ', 'Could not open the panel: ') + e.message);
    });
  }
  if (name === 'rmgo'){
    var full = (rmWay() === 'purge');
    var sure = document.getElementById('sure');
    if (full && !(sure && sure.checked)){
      document.getElementById('extra').insertAdjacentHTML('beforeend',
        '<div class="wzgap">' + Note(T('Отметьте галочку: полное удаление стирает настройки безвозвратно.',
          'Tick the checkbox: a full removal erases the settings for good.'), 'warn') + '</div>');
      return;
    }
    var log = document.getElementById('wzlog'), acts = document.getElementById('acts'), sure2 = document.getElementById('sure');
    /* ПОКА ИДЁТ — НИ УХОДА, НИ ВТОРОГО НАЖАТИЯ (ревью шага 8b): ряд кнопок пуст (как на `access-run`), галочка заперта,
       плитки не переключаются (`optPick` при задании этого экрана, `JOB_OWN`). Прежде «Назад» уводил с экрана посреди удаления, и итог не
       показывался никогда, а снятая и поставленная галочка отпирала занятую кнопку — второй запрос поверх первого. */
    actsSet('');
    if (sure2) sure2.disabled = true;
    ST.rm.log = [];
    return runJob('/api/remove', {full: full}, function(lines){
      ST.rm.log = ST.rm.log.concat(lines);
      logPush(log, lines);
    }).then(function(r){
      if (sure2) sure2.disabled = false;
      if (r.gone) return;
      ST.rm.done = {ok: !!r.ok, full: full, message: r.message || '', started: r.started !== false};
      document.getElementById('res').innerHTML = rmDoneRow(ST.rm.done);
      /* После снятия всё, что мастер знал о роутере, устарело: возвращаем в начало, а не
         на экран «панель уже стоит» — её там может уже не быть. */
      ST.conn = null; ST.facts = null;
      if (r.ok){
        /* Карточки выбора убираем ВМЕСТЕ с галочкой И советом про бэкап: план того, что
           снимется, только что заменён итогом, и второй клик («а теперь удалить полностью»)
           человек делал бы вслепую. Совет «сделайте копию ДО удаления», оставленный ПОСЛЕ
           удаления, читается издевательством — он адресован тому, кто ещё не нажал.
           Второй заход — через «В начало», где план соберётся заново.
           При ОТКАЗЕ оставляем всё: повтор там осмыслен. */
        var picks = document.getElementById('rmopt');
        if (picks) picks.remove();
        var pre = document.getElementById('pre');
        if (pre) pre.remove();
        actsSet(SP + '<button class="btn pri" data-go="scan">' + T('В начало', 'Start over') + '</button>');
      } else rmActs();   /* отказ — выбор, галочка и кнопка повтора на месте: повтор там осмыслен */
    }).catch(function(e){
      /* Обрыв связи посреди удаления — не отказ удаления: на роутере оно могло идти дальше. Говорим это, как у
         установки, и повтора сразу не предлагаем — сперва план заново («Назад» → «Удалить»). */
      if (sure2) sure2.disabled = false;
      document.getElementById('res').insertAdjacentHTML('beforeend', '<div class="wzgap">' + Note(lostTxt(e) +
        T('. Снятие на роутере могло продолжиться — вернитесь назад и откройте «Удалить» заново: план покажет, что осталось.',
          '. The removal on the router may have carried on — go back and open “Remove” again: the plan will show what is left.'), 'bad') + '</div>');
      actsSet('<button class="btn gh" data-go="exists" data-bk="1">' + T('Назад', 'Back') + '</button>');
    });
  }
}

/* ─── старт ──────────────────────────────────────────────────────────────────
   Первым делом спрашиваем агента: жив ли он и что уже знает (сохранённый адрес роутера). */
paintChrome();          /* язык мог прийти из хранилища — каркас рисуем ДО первого экрана */
api('/api/state').then(function(s){
  ST.agent = s;
  if (s.host) ST.ip = s.host;
  ENV = {k: 'ok', v: s};
  paintEnv();
  /* НАЧИНАЕМ ВСЕГДА С НАЧАЛА, что бы ни осталось в адресе. Хеш пишется как след для отладки,
     но восстанавливать по нему экран нельзя: перезагрузка страницы на «#install» запустила бы
     установку сама, без единого клика, — а состояние сеанса (ST) при перезагрузке пустое.
     ЕДИНСТВЕННОЕ исключение — задание, которое ИДЁТ ПРЯМО СЕЙЧАС: его не надо запускать, за ним
     надо смотреть, и спрашиваем мы об этом не адрес, а АГЕНТА (`job` в /api/state). Без этого
     F5 посреди установки уводил на первый экран, а работа продолжалась вслепую. */
  ST.jobName = s.job === 'run' ? (s.job_name || '') : '';
  /* Контекст идущего задания — из хранилища вкладки (см. runJob): с какого экрана и обновление ли. */
  ST.jobCtx = null;
  if (ST.jobName){ try { ST.jobCtx = JSON.parse(sessionStorage.getItem('enodia_wizard_job') || 'null'); } catch (e) {} }
  if (ST.jobCtx && ST.jobCtx.upd) ST.upd = true;
  render(s.job === 'run' ? 'resume' : 'welcome');
}).catch(function(e){
  /* 403 — агент ОТВЕТИЛ: жив, а у этой вкладки нет ключа (адрес скопирован в другую вкладку или браузер). Совет «окно
     мастера закрыли» тут неправда — нужен свой (ревью шага 8b, круг 2). */
  ENV = {k: e.http ? 'nokey' : 'dead', v: null};
  ST.agentNoKey = !!e.http;
  paintEnv();
  render('noagent');
});
</script>
</body>
</html>
