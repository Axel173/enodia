             d: T('панель встанет, но компоненты качать будет неоткуда',
                  'the panel will install, but there will be nowhere to fetch components from'), v: T('нет', 'no')},
    f.dns ? null : {mk: 'wr', t: T('DNS на роутере не резолвит', 'DNS on the router does not resolve'),
                    d: T('маршрут есть, имена не разрешаются — GitHub будет недоступен',
                         'the route works but names do not resolve — GitHub will be unreachable'), v: T('нет', 'no')},
    f.installed ? {mk: 'wr', t: T('Панель уже стоит', 'The panel is already installed'),
                   d: T('это обновление, а не установка с нуля', 'this is an update, not a fresh install'),
                   v: f.version || '?'}
                : {mk: 'wr', t: T('Панели ещё нет', 'No panel yet'),
                   d: T('это установка с нуля, а не обновление', 'this is a fresh install, not an update'), v: '—'},
    /* Прежняя установка рядом — ОТКАЗ, а не предупреждение: две копии дерутся за одни iptables
       и cron. Строка стоит ПОСЛЕДНЕЙ намеренно: она отменяет вывод предыдущей («панели ещё
       нет» — правда про НАШ каталог и неправда про роутер в целом). */
    /* СИСТЕМА НА НАКОПИТЕЛЕ. С 30.09.2026 ПК ставит туда, где система живёт (как обновление из панели), — это ФАКТ, а не
       запрет. Запрет остался один: система числится на накопителе, а накопителя нет (`store`) — ставить некуда, а на флеше
       выросла бы ВТОРАЯ система рядом с настоящей, оставшейся на полке. */
    f.store ? {mk: 'no', t: T('Система живёт на накопителе', 'The system lives on a drive'),
               d: T('…а накопителя сейчас нет — воткните его и проверьте снова',
                    '…and the drive is not plugged in — plug it in and check again'),
               v: T('нельзя ставить', 'cannot install')}
            : (f.store_mode === 'full' ? {mk: 'ok', t: T('Система живёт на накопителе', 'The system lives on a drive'),
               d: T('ставлю туда же: ' + esc(f.store_dir || ''), 'installing into the same place: ' + esc(f.store_dir || '')),
               v: T('на накопитель', 'onto the drive')} : null),
    /* Роутер занят тем, поверх чего ставить нельзя (ревью ветки pkg-update, круги 1–2): обновление или откат из панели (разорвали
       бы ему снимок отката), прежняя установка кода (доработывает отцепленно — вторая перемешала бы наборы), смена раскладки
       (установка писала бы в каталог, который сейчас копируется). Причину называет роутер (`busy`), слова — здесь. */
    BUSY[f.busy] ? {mk: 'no', t: BUSY[f.busy].t, d: BUSY[f.busy].d, v: T('нельзя ставить', 'cannot install')} : null,
    f.legacy ? {mk: 'no', t: T('Стоит прежняя версия', 'An older version is installed'),
                d: (f.legacy_dir ? esc(f.legacy_dir) : T('прежний каталог', 'the old directory')) +
                   T(' — её надо снять, иначе две копии будут драться за правила',
                     ' — it has to be removed, or two copies will fight over the same rules'),
                v: T('нельзя ставить', 'cannot install')} : null
  ]);
  var blocked = (f.space === 'none') || !f.writable || !!f.legacy || !!f.store || !!f.busy || !f.pkg_ok;
  extra.innerHTML =
    Note(T('<b>Что поставлю:</b> веб-панель :8088, скрипты, автозапуск и сторож в cron, плюс два маленьких ' +
           'компонента обхода блокировок без сервера (ByeDPI и Zapret) — они же аварийный канал до GitHub.',
           '<b>What gets installed:</b> the :8088 web panel, the scripts, autostart and the watchdog in cron, ' +
           'plus two small server-less circumvention components (ByeDPI and Zapret) — which double as an ' +
           'emergency channel to GitHub.'), 'acc') +
    '<div class="wzchips"><span class="chip wzcp">' + T('заводская морда не трогается', 'the stock web interface is untouched') +
    '</span><span class="chip wzcp">' + T('Wi-Fi и настройки сети остаются вашими', 'Wi-Fi and network settings stay yours') +
    '</span><span class="chip wzcp">' + T('снимается целиком — из панели или мастером', 'fully removable — from the panel or this wizard') + '</span></div>' +
    (f.space === 'tight' ? '<div class="wzgap">' +
       Note(T('Места меньше, чем занимает payload на компьютере. UBIFS сжимает, и обычно этого хватает — ' +
              'а если не хватит, установка сама снимет то, что успела положить, и роутер останется прежним.',
              'There is less free space than the payload takes on the computer. UBIFS compresses, and usually ' +
              'that is enough — and if it is not, the installation removes what it managed to place, and the ' +
              'router stays as it was.'), 'warn') +
       Chk('tight', T('Понимаю и всё равно пробую', 'I understand and want to try anyway')) + '</div>' : '') +
    (f.space === 'none' ? '<div class="wzgap">' +
       Note(T('<b>Установка не начнётся.</b> Чистить чужой роутер молча мастер не станет. Освободите место ' +
              '(по SSH: <code>du -xsk ' + spmp + '/* | sort -n | tail -15</code>) и проверьте снова.',
              '<b>The installation will not start.</b> The wizard will not clean out someone else’s router on ' +
              'its own. Free up space (over SSH: <code>du -xsk ' + spmp + '/* | sort -n | tail -15</code>) and check ' +
              'again.'), 'bad') + '</div>' : '') +
    /* Кнопка выключена — и человек обязан прочитать ПОЧЕМУ. Без этой строки он ставит галочку
       «всё равно пробую», видит мёртвую кнопку и решает, что сломан мастер. */
    (f.legacy ? '<div class="wzgap">' +
       Note(T('<b>Установка не начнётся.</b> На роутере лежит установка прежней версии — ' +
              '<code>' + esc(f.legacy_dir || '') + '</code>. Снимите её: в её же панели ' +
              '«Настройки» → «Удаление» → «Удалить всё», либо по SSH ' +
              '<code>sh ' + esc(f.legacy_dir || '') + '/uninstall.sh purge</code>. ' +
              'Сами мы её не трогаем: снять установку умеет только её собственный снимальщик — ' +
              'он знает свои имена правил и задач, а мы уже нет.',
              '<b>The installation will not start.</b> An older installation is present on the router — ' +
              '<code>' + esc(f.legacy_dir || '') + '</code>. Remove it from its own panel: ' +
              '“Settings” → “Uninstall” → “Remove everything”, or over SSH ' +
              '<code>sh ' + esc(f.legacy_dir || '') + '/uninstall.sh purge</code>. ' +
              'We do not touch it ourselves: only its own uninstaller knows the names of its rules and ' +
              'cron jobs — we no longer do.'), 'bad') + '</div>' : '') +
    (f.store ? '<div class="wzgap">' +
       Note(T('<b>Установка не начнётся.</b> Система стоит на внешнем накопителе, а накопителя на ' +
             'роутере сейчас нет. Воткните его: панель и настройки поднимутся сами. Ставить ' +
             'сейчас нельзя — на флеше выросла бы ВТОРАЯ установка, а прежняя, с ключами и ' +
             'паролем панели, осталась бы на накопителе сиротой.',
             '<b>The installation will not start.</b> The system is installed on an external drive, ' +
             'and the drive is not in the router right now. Plug it in: the panel and the settings ' +
             'come back on their own. Installing now is not possible — a SECOND installation would ' +
             'grow on the flash, and the old one, with the keys and the panel password, would be ' +
             'orphaned on the drive.'), 'bad') + '</div>' : '') +
    (f.busy ? '<div class="wzgap">' +
       Note(T('<b>Установка не начнётся:</b> ', '<b>The installation will not start:</b> ') +
            (BUSY[f.busy] ? BUSY[f.busy].n : esc(f.busy)) +
            T(' Дождитесь конца и проверьте снова.', ' Wait for it to finish and check again.'), 'bad') + '</div>' : '') +
    (!f.writable ? '<div class="wzgap">' +
       Note(T('<b>Установка не начнётся:</b> каталог <code>' + esc(f.dir) + '</code> не записывается. ' +
              'Чаще всего это значит, что на роутер вошли не под root — проверьте, тем ли паролем ' +
              'входили, и попробуйте снова.',
              '<b>The installation will not start:</b> the directory <code>' + esc(f.dir) + '</code> is not ' +
              'writable. Most often that means the router session is not root — check which password was ' +
              'used and try again.'), 'bad') + '</div>' : '') +
    (!f.pkg_ok ? '<div class="wzgap">' +
       Note(T('<b>Установка не начнётся:</b> ставить нечем — код роутера едет одним пакетом ' +
              '(<code>enodia-*.tar.gz</code> рядом с мастером), а с ним не так: ' + esc(f.pkg_why || '') + '.',
              '<b>The installation will not start:</b> there is nothing to install — the router code travels as one ' +
              'package (<code>enodia-*.tar.gz</code> next to the wizard), and something is wrong with it: ' +
              esc(f.pkg_why || '') + '.'), 'bad') + '</div>' : '');
  actsSet('<button class="btn gh" data-act="recheck">' + T('Проверить снова', 'Check again') +
    '</button><div class="grow"></div>' +
    /* Панель стоит — пришли с «Панель уже стоит», туда и дорога назад (`data-bk`: «назад» браузера идёт по ней). */
    (f.installed ? '<button class="btn" data-go="exists" data-bk="1">' + T('Что с ней можно сделать', 'What can be done with it') +
      '</button>' : '') +
    '<button class="btn pri" data-act="install"' + (blocked ? ' disabled data-blocked="1"' : '') +
    (f.space === 'tight' ? ' data-need="tight"' : '') + '>' +
    (f.installed ? T('Обновить', 'Update') : T('Установить', 'Install')) + '</button>');
  syncNeed();
}

/* ═══ 7. УСТАНОВКА. Прогресс ЭТАПАМИ и живой лог: этапы разной длины, и человек должен
   видеть, что процесс идёт, а не завис. ═══════════════════════════════════════ */
scr('install', {step: 2, once: true, t: Lbl('Ставлю панель', 'Installing the panel'),
 sub: Lbl('Полторы-две минуты. Роутер продолжает раздавать интернет — связь не прервётся.',
          'A minute or two. The router keeps serving the internet — your connection will not drop.'),
 body: function(){
   return '<div id="res" role="status">' + Rows([{mk: 'run', t: T('Идёт установка…', 'Installing…'),
     d: T('проверка → заливка → установщик → проверка', 'checks → upload → installer → verification')}]) + '</div>' +
     '<div class="wzgap">' + Log('wzlog') + '</div>';
 },
 acts: [],
 enter: function(){
   var res = document.getElementById('res'), log = document.getElementById('wzlog');
   runJob('/api/install', {tight_ok: ST.tight === true}, function(lines){
     logPush(log, lines);
   }).then(function(r){
     if (r.gone) return;
     if (r.ok){
       ST.panelUp = true;   /* экран «Мастер закрыт» называет адрес панели, только когда она правда стоит */
       res.innerHTML = Rows([{mk: 'ok', t: T('Панель установлена', 'The panel is installed'),
         d: T('файлы, cron и автозапуск на месте', 'files, cron and autostart are in place'), v: r.url || ''}]);
       /* Обновление (панель уже стояла) пароль панели не трогает: задать новый можно, но и оставить прежний — тоже.
          Прежде единственная дорога вела через «Задать пароль» (ревью шага 8b, круг 2). */
       actsSet((ST.upd ? keepPwBtn() : '') +
         SP + '<button class="btn pri" data-go="panelpw">' + T('Дальше · пароль панели', 'Continue · panel password') + '</button>');
     } else if (r.stage === 'running'){
       /* Установщик на роутере ещё работает (он отцеплен и доработает сам) или роутер не ответил — это не неудача, и
          «Повторить» здесь вредно: вторая установка поверх первой откажет, а человек решит, что сломано. Дорога — к проверке:
          она скажет «идёт установка кода», пока та не кончится (ревью ветки pkg-update, круг 2). */
       res.innerHTML = Rows([{mk: 'wr', t: T('Установка ещё идёт на роутере', 'The installation is still running on the router'),
         d: esc(r.error || ''), v: T('идёт', 'running')}]);
       actsSet('<div class="grow"></div><button class="btn pri" data-go="check">' + T('Проверить снова', 'Check again') + '</button>');
     } else {
       /* «Установка не прошла» — это ТРИ разные беды (проверка, заливка, установщик), и
          повторять после каждой можно: установка идемпотентна. */
       res.innerHTML = Rows([{mk: 'no', t: T('Установка не завершилась', 'The installation did not finish'),
         d: esc(r.error || T('смотрите вывод ниже', 'see the output below')),
         v: {preflight: T('проверка', 'checks'), upload: T('заливка', 'upload'),
             installer: T('установщик', 'installer')}[r.stage] || ''}]);
       actsSet('<button class="btn gh" data-go="check" data-bk="1">' + T('К проверке', 'Back to checks') +
         '</button><div class="grow"></div>' +
         '<button class="btn pri" data-go="install">' + T('Повторить', 'Try again') + '</button>');
     }
   }).catch(function(e){
     /* Оборвалась связь С АГЕНТОМ (не с роутером): установка при этом могла и продолжаться.
        Кнопки обязаны остаться — иначе экран становится тупиком ровно там, где страшнее всего. */
     res.innerHTML = Note(lostTxt(e) + T('. Установка на роутере могла продолжиться — проверьте состояние, прежде чем повторять.',
         '. The installation on the router may have carried on — check the state before retrying.'), 'bad');
     actsSet('<button class="btn gh" data-act="recheck">' + T('Проверить состояние', 'Check the state') +
       '</button><div class="grow"></div>' +
       '<button class="btn" data-go="scan">' + T('В начало', 'Start over') + '</button>');
   });
 }});

/* ═══ 8. ПАРОЛЬ ПАНЕЛИ. Отдельным экраном и ПОСЛЕ установки: до неё пароль некуда положить,
   а панель без пароля не отдаётся никому. ═════════════════════════════════════ */
/* Экран служит ДВУМ входам, и это одна и та же работа: шаг установки («панель поставлена —
   придумайте пароль») и «Панель уже стоит» -> «Сменить пароль панели» (пароль забыт: в саму
   панель войти нечем, а сменить его больше неоткуда — раньше это умело ТОЛЬКО текстовое меню).
   Владелец применения один — `_apply_panel_password` на ПК, — поэтому и экран один: собран
   фабрикой и разложен в два id. Второй копии ФОРМЫ не заводить: разъехавшиеся правила ввода на
   двух входах мы уже чинили (16.08.2026 — лишний символ дал роутер, в панель которого не войти).
   Отличий ровно два: в режиме смены экран говорит, что установку не трогает, и имеет дорогу
   НАЗАД — пришли не из потока, и человек вправе передумать; метка `bk` нужна, чтобы «назад»
   БРАУЗЕРА вела туда же, куда кнопка (иначе она увела бы вперёд и запустила чужое задание). */
function panelPwScreen(only){
 return {step: 2,
 t: only ? Lbl('Сменить пароль панели', 'Change the panel password')
         : Lbl('Пароль веб-панели', 'Web panel password'),
 sub: only ? Lbl('Забыли пароль от панели — задайте новый. Панель спросит его формой при открытии.',
                 'Forgot the panel password — set a new one. The panel asks for it in a sign-in form when it opens.')
           : Lbl('Панель доступна всем, кто в вашей сети, — поэтому у неё свой пароль. Панель спросит его формой при открытии.',
                 'The panel is reachable by everyone on your network, so it has a password of its own. ' +
                 'The panel asks for it in a sign-in form when it opens.'),
 body: function(){
   return '<div class="wztwo">' + Fld('p1', T('Пароль', 'Password'), '', '', 'password') +
     Fld('p2', T('Ещё раз', 'Repeat'), '', '', 'password') +
     '<span class="wzhint">' + T('8–64 символа, без пробелов и кириллицы · опечатку иначе не поймать: панель подтвердит ровно то, что вы набрали',
       '8–64 characters, no spaces, no Cyrillic · the only way to catch a typo: the panel will accept exactly what you typed') +
     '</span></div>' +
   '<div class="wzgap">' + Note(T('Это <b>не</b> пароль root от роутера и не пароль от заводской морды Xiaomi. Третий, отдельный.',
          'This is <b>not</b> the router’s root password, nor the Xiaomi stock interface password. ' +
          'It is a third, separate one.'), 'warn') + '</div>' +
   (only ? '<div class="wzgap">' + Note(T('Меняется только пароль панели: скрипты, серверы и правила роутера остаются как есть.',
          'Only the panel password changes: the router scripts, servers and rules stay as they are.'), 'info') + '</div>' : '') +
   '<div class="wzgap">' + Note(T('Проверю пароль тем же путём, которым пойдёт браузер: не «команда выполнилась», ' +
        'а «панель пустила».',
        'The password is verified the same way the browser will use it: not “the command ran”, but ' +
        '“the panel let us in”.'), 'info') + '</div>' +
   '<div id="res" role="status"></div>';
 },
 acts: only ? [{t: Lbl('Назад', 'Back'), go: 'exists', k: 'gh', bk: true},
               {t: Lbl('Задать пароль', 'Set the password'), act: 'panelpw', k: 'pri'}]
            : [{t: Lbl('Задать пароль', 'Set the password'), act: 'panelpw', k: 'pri'}],
 enter: function(){
   pwEnter('panelpw');
   /* Обновление — прежний пароль можно оставить и отсюда (сюда же ведёт F5 посреди обновления). */
   if (!only && ST.upd){ var ka = document.getElementById('acts'); if (ka) ka.insertAdjacentHTML('afterbegin', keepPwBtn()); }
   if (!REPAINT){ ST.pwDone = null; return; }
   if (only && ST.pwDone) pwDonePaint();
 }};
}
/* Куда после заданного пароля панели: экран раскладки существует, ТОЛЬКО когда роутеру есть что предложить (накопитель
   виден и бутстрап назвал текущую раскладку). Спрашивает об этом задание пароля — тем же SSH-сеансом. Иначе экран мигнул
   бы и увёл дальше сам. Один разбор на экран пароля и на F5 (`RESUME`). */
function keepPwBtn(){ return '<button class="btn gh" data-act="keeppw">' + T('Оставить прежний пароль', 'Keep the current password') + '</button>'; }
function pwNext(r){
  ST.store = r.store || null;
  var cn = (ST.store && ST.store.cands) || [];
  return (ST.store && ST.store.mode && cn.length) ? 'storage' : 'done';
}
/* Enter в любом из двух полей пароля — то же, что кнопка действия (на «Найдём роутер», «Пароль root» и форме доступа
   Enter работал, здесь — нет; ревью шага 8b, круг 2). */
function pwEnter(a){
  ['p1', 'p2'].forEach(function(id){
    var i = document.getElementById(id);
    if (i) i.addEventListener('keydown', function(e){ if (e.key === 'Enter') act(a, document.querySelector('#acts [data-act="' + a + '"]')); });
  });
}
/* Успех смены пароля панели — на месте (человек ничего не устанавливал, в «Готово» ему не за чем). Художник один —
   на ответ роутера и на смену языка (`ST.pwDone` — адрес панели, который назвал агент). */
function pwDonePaint(){
  var res = document.getElementById('res'), ac = document.getElementById('acts');
  /* Поля с принятым паролем убираем: Enter в них задавал его второй раз (ревью шага 8b, круг 3). */
  var fm = document.querySelector('#wz-view .wztwo'); if (fm) fm.remove();
  if (res) res.innerHTML = '<div class="wzgap">' + Note(T('Панель приняла новый пароль. Адрес ',
    'The panel accepted the new password. Address ') + '<b>' + esc(ST.pwDone.url) + '</b>.', 'ok') + '</div>';
  if (ac) actsSet('<button class="btn gh" data-go="exists" data-bk="1">' + T('Назад', 'Back') + '</button>' + SP +
    '<button class="btn pri" data-act="openpanel">' + T('Открыть панель', 'Open the panel') + '</button>');
}
scr('panelpw', panelPwScreen(false));
scr('panelpw-only', panelPwScreen(true));

/* ═══ 8b. РАСКЛАДКА. Экран появляется ТОЛЬКО там, где роутер видит накопитель: спрашивать
   «куда ставить» на роутере без флешки — вопрос ради вопроса.
   Стоит ПОСЛЕ пароля панели, а не до установки, и это не «как удобнее». Переносит систему САМ
   РОУТЕР (usb-offload.sh), а до установки его на роутере нет вовсе; свежая установка с ПК ложится
   на флеш (переустановка — туда, где система уже живёт, с 30.09.2026). Значит у НОВОЙ системы порядок
   ровно один — «поставили на флеш → убедились, что панель пускает → перенесли», и он же обратим:
   не переехало — установка цела.
   ═══════════════════════════════════════════════════════════════════════════════ */
scr('storage', {step: 2, picks: ['store', 'removable'], t: Lbl('Где будет жить система', 'Where the system will live'),
 sub: Lbl('К роутеру подключён накопитель. На него можно перенести часть системы или всю — ' +
          'или оставить всё как есть.',
          'A drive is plugged into the router. Part of the system — or all of it — can move there, ' +
          'or you can leave everything as it is.'),
 body: function(){
   return '<div id="res" role="status">' + Rows([{mk: 'run', t: T('Спрашиваю роутер…', 'Asking the router…'),
     d: T('что за накопитель и сколько на нём места',
          'what the drive is and how much room it has')}]) + '</div>' +
     '<div class="wzgap" id="extra"></div>';
 },
 /* Кнопка ухода стоит СРАЗУ, до ответа роутера: экран без единой кнопки — тупик (то же
    правило, что на экране проверки). */
 acts: [{t: Lbl('Пропустить', 'Skip'), go: 'done', k: 'gh'}],
 enter: function(){
   /* Срез берём из сеанса, если он там уже есть (его привёз экран пароля или «Оставить прежний пароль» — оба ведут
      сюда только через `pwNext`, то есть когда накопитель виден). Обнулили его ровно в одном месте — после попытки
      переезда: возвращаться к выбору надо с тем, что на роутере СЕЙЧАС. */
   if (ST.store) return showStore(ST.store);
   if (REPAINT && ST.storeErr) return storeFail(ST.storeErr);
   ST.storeErr = null;
   /* Ответ и отказ ушедшего экрана `runJob` гасит сам (`gone`). */
   runJob('/api/store', {}).then(function(r){
     if (r.gone) return;
     ST.store = r.store || {};
     showStore(ST.store);
   }).catch(function(e){ storeFail(ST.storeErr = {error: e.message, http: e.http}); });
 }});
function storeFail(se){
  var res = document.getElementById('res');
  if (res) res.innerHTML = Note(failTxt(T('Не смог спросить роутер: ', 'Could not ask the router: '), {message: se.error, http: se.http}), 'bad');
}

/* ГДЕ ЖИВЁТ СИСТЕМА — человеческим словом. `data`/`bins`/`full` это язык движка, и в лицо
   человеку он уже попадал (ярлыки `nopass`/`negotiation` на экране входа — их вычищали
   отдельной правкой). Кисть ОДНА на оба экрана раскладки: две копии разошлись бы. */
function storeWhere(m){
  /* `none` — законный ответ бутстрапа: «код на накопителе, а накопителя НЕТ» (его видно, если
     флешку выдернули посреди переезда). Без своей строки сюда приехало бы слово движка. */
  return {data: T('на роутере', 'on the router'), bins: T('частично', 'partly'),
          full: T('на накопителе', 'on the drive'),
          none: T('накопителя нет', 'no drive')}[m] || m || '';
}
function showStore(s){
  var res = document.getElementById('res'), extra = document.getElementById('extra');
  var cands = (s.cands || []).filter(function(c){ return c && c.dev; });
  var mode = s.mode || '';
  /* Режим называет БУТСТРАП, и пусто — это не «data». Пусто значит, что бутстрапа на роутере
     нет (сборка старее фичи либо `boot.sh sync` не прошёл): перенести систему нечем, и
     карточки, которые молча ничего не делают, хуже их отсутствия. Ровно тем же правилом
     живёт панель — раздел раскладки она в этом случае не рисует. */
  if (!mode || !cands.length){
    res.innerHTML = Rows([{mk: 'wr',
      t: cands.length ? T('Раскладку менять нечем', 'There is no layout to change')
                      : T('Накопителя роутер не видит', 'The router does not see a drive'),
      d: cands.length ? T('роутер не назвал текущую раскладку — обновите установку и попробуйте из панели',
                          'the router did not name its current layout — update the installation and try from the panel')
                      : T('всё останется во встроенной памяти роутера — как и было',
                          'everything stays in the router’s built-in storage, just as before'),
      v: T('пропускаю', 'skipping')}]);
    extra.innerHTML = '';
    actsSet('<div class="grow"></div><button class="btn pri" data-go="done">' + T('Дальше', 'Continue') + '</button>');
    return;
  }
  /* Ёмкость показываем ТОЛЬКО когда накопитель один и уже смонтирован: движок не монтирует
     чужую флешку ради красивой цифры, а `blkid` на роутере нет. Не знаем — так и говорим,
     а не выдумываем «≈ 32 ГБ». Правило и текст — те же, что в панели. */
  var one = cands.length === 1 ? cands[0] : null;
  var free = one && Number(one.free_b) > 0 ? Number(one.free_b) : Number(s.store_free_b);
  var total = one && Number(one.total_b) > 0 ? Number(one.total_b) : Number(s.store_total_b);
  res.innerHTML = Rows([
    {mk: 'ok', t: T('Сейчас система живёт', 'The system currently lives'),
     d: {data: T('целиком во встроенной памяти роутера', 'entirely in the router’s built-in storage'),
         bins: T('на накопителе только тяжёлые протоколы, остальное на роутере',
                 'only the heavy protocols are on the drive; the rest is on the router'),
         full: T('на накопителе целиком', 'entirely on the drive')}[mode] || '',
     v: storeWhere(mode)},
    {mk: 'ok', t: T('Накопитель', 'The drive'),
     d: one ? (esc(one.dev) + (one.fs && one.fs !== '?' ? ' · ' + esc(one.fs) : '') +
               (one.mnt && one.mnt !== '-' ? T(' · уже смонтирован', ' · already mounted')
                                           : T(' · роутер смонтирует сам', ' · the router will mount it')))
            : T('роутер видит несколько — выберите ниже', 'the router sees several — pick one below'),
     v: total > 0 ? T('свободно ' + hb(free), hb(free) + ' free')
                  : T('размер узнаем при переносе', 'size known once it is mounted')}
  ]);
  /* «Сейчас так» — на карточке текущей раскладки: она никуда не ведёт, но и не спрятана.
     Спрятать значило бы заставить искать, чем сейчас всё устроено. */
  var cur = function(m){ return m === mode ? T(' · сейчас так', ' · current') : ''; };
  var sel = storeSel();
  /* ХРАНИТ ЛИ ПРАВА ФС ЦЕЛЕВОГО накопителя. Считает РОУТЕР (поле `perm` кандидата,
     mount-lib.sh::fs_keeps_perms) — своей таблицы файловых систем здесь нет и быть не должно:
     вторая копия уже есть в панели, третья разошлась бы с обеими. Старый движок поля не
     назовёт ⇒ `undefined` ⇒ «не хранит», то есть прежний текст байт-в-байт.
     Свойство это — ВЫБРАННОГО накопителя, а не первого попавшегося: накопителей бывает
     несколько и размечены они по-разному, поэтому на смену выбора экран перерисовывается
     (общий обработчик change ниже). */
  var tgt = one || cands.filter(function(c){ return c.dev === ST.storeDev; })[0] || cands[0];
  var perm = !!(tgt && tgt.perm === true);
  var tgtFs = (tgt && tgt.fs && tgt.fs !== '?') ? esc(tgt.fs) : '';
  extra.innerHTML =
    (one ? '' : '<label class="dsfld">' + T('Какой накопитель', 'Which drive') +
       '<span class="wzinp"><select class="inp wzi" id="storedev">' + cands.map(function(c){
         return '<option value="' + esc(c.dev) + '">' + esc(c.dev) +
           (Number(c.total_b) > 0 ? ' · ' + hb(c.total_b) : '') + '</option>'; }).join('') +
       '</select></span><span class="wzhint">' +
       T('Движок не угадывает: накопителей несколько, и выбрать должен человек.',
         'The engine does not guess: there is more than one drive, so the choice is yours.') +
       '</span></label>') +
    '<div class="wzgap">' + Opt('store', [
      {v: 'data', ic: 'i-router', t: T('На роутере', 'On the router') + cur('data'),
       d: T('Вся система во встроенной памяти. Накопитель можно вынуть — ничего не изменится.',
            'The whole system stays in built-in storage. The drive can be pulled out and nothing changes.')},
      {v: 'bins', ic: 'i-zap', t: T('Протоколы — на накопителе', 'Protocols on the drive') + cur('bins'),
       d: T('Xray, Hysteria2 и десинк переедут на накопитель, освободив место. Код, настройки и ключи ' +
            'останутся на роутере.',
            'Xray, Hysteria2 and the desync tools move to the drive and free up room. The code, the ' +
            'settings and the keys stay on the router.')},
      {v: 'full', ic: 'i-usb', t: T('Всё на накопителе', 'Everything on the drive') + cur('full'),
       d: T('На роутере останется только запускатель (около 20 КБ). Без накопителя роутер работает ' +
            'как обычный, без VPN.',
            'Only the launcher (about 20 KB) stays on the router. Without the drive the router works ' +
            'as a plain router, with no VPN.')}
    ], sel) + '</div>' +
    /* ЦЕНУ НАЗЫВАЕМ ДО КЛИКА, а не после. Пользователь принял этот размен осознанно («это
       домашние устройства») — значит и человеку за мастером он обязан быть назван вслух, а не
       найден потом в документации. Галочка — тот же механизм согласия, что у «места впритык».

       ФАКТОВ ЗДЕСЬ ДВА, И ОНИ РАЗНЫЕ — прежний текст сваливал их в один и врал половине людей:
         * НОСИТЕЛЬ СЪЁМНЫЙ. Кто его вынул и вставил в компьютер — прочитает всё. Это верно при
           ЛЮБОЙ разметке: под своим root'ом права чужой машине не указ. Отсюда галочка стоит
           ВСЕГДА, и текст про exFAT её никогда не отпирал.
         * ПРАВА ДОСТУПА НА САМОМ РОУТЕРЕ. Вот это уже свойство ФС: exFAT их не хранит вовсе и
           монтируется с fmask=0000 (0777 на каждый файл), а ext4 хранит. Роутер не однопользо-
           вательский — проба десинка бежит из-под nobody, — так что разница настоящая.
       Владелец ответа на второй вопрос — роутер (`perm`), здесь только выбор строки. */
    /* Цена и согласие — у ВЫБРАННОГО «всё на накопителе» (и если раскладка уже не такая): у «протоколов» и «на
       роутере» галочка ничего не запирала, а плашка про секреты читалась ценой того, что человек выбрал (ревью 8b). */
    (sel !== 'full' || mode === 'full' ? '' :
    '<div class="wzgap">' +
    Note(T('<b>Всё на накопителе:</b> туда переедут и секреты — ключи AmneziaWG, ссылки подписок, ' +
           'хэш пароля панели и пароль почты. Накопитель съёмный: кто вынет его и вставит в ' +
           'компьютер — прочитает всё.',
           '<b>Everything on the drive:</b> the secrets move along — AmneziaWG keys, subscription links, ' +
           'the panel password hash and the mail password. The drive is removable: anyone who pulls it ' +
           'out and plugs it into a computer can read everything.') +
         /* СОСТОЯНИЙ ТРИ, А НЕ ДВА, и третье — самое частое. ФС кандидата роутер знает, ТОЛЬКО
            если тот уже смонтирован: `blkid` на роутере нет, а монтировать чужую флешку ради
            информационного экрана — побочный эффект (см. cmd_detect). ЗАМЕР 02.09.2026: сразу
            после форматирования в ext4 стоковый automount флешку не поднял (uuid сменился), и
            экран, зная про неё только имя устройства, уверенно сообщил «exFAT прав не хранит».
            Гейт при этом был верен (галочка на месте), а вот УТВЕРЖДЕНИЕ — нет: мы называли
            конкретную ФС у накопителя, разметки которого не знаем. Ровно тот класс, ради
            которого вся эта правка и затевалась, — поэтому «не знаем» говорим вслух. */
         /* Текст ветки «права хранит» — макета `wz-storage`: оба факта одной фразой — от программ роутера закрыто, от
            вынувшего флешку не спасает. */
         (perm
           ? T(' Разметка ' + (tgtFs || 'этого накопителя') + ' права хранит — от остальных программ на роутере ключи закрыты, ' +
               'но от того, кто вынет флешку, не спасает и она.',
               ' The ' + (tgtFs ? tgtFs + ' format' : 'format of this drive') + ' keeps access rights — the keys are closed to ' +
               'the other programs on the router, but it does not stop whoever pulls the drive out either.')
           : tgtFs
           ? T(' Прав доступа на нём вдобавок нет: exFAT их не хранит, и роутер монтирует его так, ' +
               'что файлы открыты и остальным программам на самом роутере. Разметка ext4 это ' +
               'убирает — но съёмности носителя не отменяет.',
               ' On top of that it keeps no access rights: exFAT does not store them, and the router ' +
               'mounts it so the files are open to the other programs on the router as well. An ext4 ' +
               'drive removes that — but not the fact that the drive is removable.')
           : T(' Какая на нём разметка — узнаем при переносе, он ещё не смонтирован. Если exFAT или ' +
               'FAT, прав доступа на нём нет вовсе: файлы будут открыты и остальным программам на ' +
               'самом роутере. Если ext4 — права сохранятся. На съёмность носителя это не влияет ' +
               'в любом случае.',
               ' Which format it uses we will learn during the move — it is not mounted yet. If it is ' +
               'exFAT or FAT, it keeps no access rights at all: the files will be open to the other ' +
               'programs on the router as well. If it is ext4, the rights are kept. Either way this ' +
               'does not change the fact that the drive is removable.')), 'warn') +
    /* Идентификатор — про СЪЁМНОСТЬ, а не про exFAT: согласие спрашивается при любой разметке,
       и имя `exfat` звало бы будущего читателя убрать галочку вместе с exFAT-веткой текста. */
    Chk('removable', T('Понимаю: ключи и пароли будут лежать на съёмном накопителе',
                       'I understand: keys and passwords will live on a removable drive')) +
    '</div>');
  /* Выбор накопителя и галочка переживают перерисовку: она затем и происходит, что от выбора зависит
     текст выше, — а сбросить при этом сам выбор значило бы отменять действие человека. Галочку возвращает `Chk`
     (из `ST.pick`), накопитель — здесь. */
  var sd = document.getElementById('storedev');
  if (sd && ST.storeDev) sd.value = ST.storeDev;
  storeActs();
}
/* Выбранная плитка раскладки: не выбирали — текущая раскладка (её плитка «· сейчас так»). */
function storeSel(){ return ST.pick.store || ((ST.store || {}).mode || ''); }
/* РЯД КНОПОК РАСКЛАДКИ зависит от выбора, поэтому собирается здесь, а не в описании экрана. Выбрана текущая —
   переносить нечего, и кнопка одна: «Дальше» (две кнопки в одно место — «Пропустить» и «Оставить так» — читались бы
   как два разных исхода). Выбрано «всё на накопителе» — «Перенести» заперта галочкой про съёмный носитель
   (`data-need`): цена названа ДО нажатия, и мимо неё не пройти. */
function storeActs(){
  var a = document.getElementById('acts'), mode = (ST.store || {}).mode || '', sel = storeSel();
  if (!a) return;
  actsSet(sel === mode
    ? SP + '<button class="btn pri" data-go="done">' + T('Дальше', 'Continue') + '</button>'
    : '<button class="btn gh" data-go="done">' + T('Пропустить', 'Skip') + '</button>' + SP +
      '<button class="btn pri" data-act="storego"' + (sel === 'full' ? ' data-need="removable"' : '') + '>' +
      T('Перенести', 'Move') + '</button>');
  syncNeed();
}

/* ПЕРЕЕЗД. Свой экран, помеченный `once`: перерисовка (смена языка) запустила бы перенос
   второй раз — то же правило, что у установки. ══════════════════════════════════ */
scr('storerun', {step: 2, once: true, t: Lbl('Переношу', 'Moving the system'),
 sub: Lbl('Роутер копирует файлы и сверяет каждый. Панель ненадолго исчезнет и поднимется уже ' +
          'на новом месте — это нормально.',
          'The router copies the files and verifies every one. The panel disappears for a moment and ' +
          'comes back in its new place — that is expected.'),
 body: function(){
   return '<div id="res" role="status">' + Rows([{mk: 'run', t: T('Переношу…', 'Moving…'),
     d: T('копия → сверка → пробный запуск → переключение',
          'copy → verify → test run → switch')}]) + '</div>' +
     '<div class="wzgap">' + Log('wzlog') + '</div>';
 },
 acts: [],
 enter: function(){
   var res = document.getElementById('res'), log = document.getElementById('wzlog');
   runJob('/api/storemode', {mode: ST.storeMode, dev: ST.storeDev}, function(lines){
     logPush(log, lines);
   }).then(function(r){
     if (r.gone) return;
     /* Срез устарел в ЛЮБОМ исходе — и на успехе, и на отказе: к выбору надо возвращаться с
        тем, что на роутере сейчас, а не с тем, что было до попытки. */
     ST.store = null;
     if (r.ok){
       ST.storeDone = r.mode || ST.storeMode;
       /* Движок ответил «режим уже такой» — переезда не было. Состояние могло смениться между
          отрисовкой выбора и кликом (панель, вторая сессия мастера), и рапорт «перенесено» о
          несостоявшемся переезде — то же враньё, что письмо о падении того, что не поднималось. */
       if (r.same){
         res.innerHTML = Rows([{mk: 'ok', t: T('Раскладка уже такая', 'The layout is already like this'),
           d: T('переносить нечего: роутер уже живёт именно так',
                'nothing to move: the router already lives exactly this way'),
           v: storeWhere(ST.storeDone)}]);
         actsSet('<div class="grow"></div><button class="btn pri" data-go="done">' + T('Дальше', 'Continue') + '</button>');
         return;
       }
       /* Исход — заголовком (макет `wz-storerun`), строкой — пройденные этапы и что теперь где, чип — «готово». */
       headSet(T('Перенесено', 'Moved'), T('Роутер скопировал файлы и сверил каждый. Панель поднялась уже на новом месте.',
                                           'The router copied the files and verified every one. The panel is back up in its new place.'));
       res.innerHTML = Rows([{mk: 'ok', t: T('копия → сверка → пробный запуск → переключение', 'copy → verify → test run → switch'),
         d: {data: T('всё вернулось во встроенную память роутера',
                     'everything is back in the router’s built-in storage'),
             bins: T('протоколы теперь на накопителе', 'the protocols now live on the drive'),
             full: T('система на накопителе, на роутере остался только запускатель',
                     'the system lives on the drive; only the launcher stays on the router')}[ST.storeDone] || '',
         v: T('готово', 'done')}]);
       actsSet('<div class="grow"></div><button class="btn pri" data-go="done">' + T('Дальше', 'Continue') + '</button>');
     } else if (r.running){
       /* Движок ещё переносит (агент перестал ждать по потолку) — это не «перенести не вышло»: писать «установка цела,
          не переехала только раскладка» про идущий перенос — неправда (ревью шага 8b, круг 3). */
       res.innerHTML = Rows([{mk: 'wr', t: T('Перенос ещё идёт', 'The move is still running'), d: esc(r.error || '')}]);
       actsSet('<div class="grow"></div><button class="btn pri" data-go="done">' + T('Дальше', 'Continue') + '</button>');
     } else {
       /* ОТКАЗ ПЕРЕЕЗДА — НЕ ОТКАЗ УСТАНОВКИ, и сказать это надо прямо: панель работает, пароль
          задан, прежней осталась только раскладка. Без этой строки красная плашка читается как
          «установка сломалась», и человек идёт переустанавливать рабочую систему. */
       /* Значение — где система осталась (агент отдаёт факт), словом, а не режимом. БЕЗ
          приставки «осталась»: она склеивалась со словом-статусом в «осталась накопителя нет»
          (поймано браузером). Заголовок строки и так говорит, что переезда не было. */
       res.innerHTML = Rows([{mk: 'no', t: T('Перенести не вышло', 'The move did not go through'),
         d: esc(r.error || T('смотрите вывод ниже', 'see the output below')),
         v: storeWhere(r.mode)}]);
       res.insertAdjacentHTML('beforeend', '<div class="wzgap">' +
         Note(T('<b>Установка цела.</b> Панель работает там же, где и была, пароль задан — не переехала ' +
                'только раскладка. Её можно сменить позже из панели.',
                '<b>The installation is intact.</b> The panel works where it did and the password is set — ' +
                'only the layout stayed put. It can be changed later from the panel.'), 'acc') + '</div>');
       actsSet('<button class="btn gh" data-go="storage" data-bk="1">' + T('К выбору', 'Back to the choice') +
         '</button><div class="grow"></div>' +
         '<button class="btn pri" data-go="done">' + T('Дальше', 'Continue') + '</button>');
     }
   }).catch(function(e){
     ST.store = null;
     res.innerHTML = Note(lostTxt(e) +
       T('. Перенос на роутере запущен отцепленно и мог продолжиться — загляните в панель, прежде чем повторять.',
         '. The move runs detached on the router and may have carried on — look at the panel before retrying.'),
       'bad');
     actsSet('<button class="btn gh" data-go="storage" data-bk="1">' + T('К выбору', 'Back to the choice') +
       '</button><div class="grow"></div>' +
       '<button class="btn" data-go="done">' + T('Дальше', 'Continue') + '</button>');
   });
 }});

/* ═══ 8в. ЗАДАНИЕ УЖЕ ИДЁТ. Экран для одного случая: вкладку перезагрузили (или закрыли и
   открыли заново) ПОСРЕДИ работы. Задание живёт в агенте и доживёт само — но до 02.09.2026
   страница об этом не знала и начинала с #welcome, то есть человек терял и прогресс, и
   результат, а «Начать» вело по кругу к кнопке, которую агент честно отказывался выполнять
   («уже идёт»). Экран НЕ запускает ничего: только смотрит (watchJob) и показывает исход.
   Кнопок ухода нет намеренно — уходить некуда, пока идёт работа; исход добавит кнопку сам. ═══ */
/* ЗАДАНИЕ НАЗЫВАЕТ АГЕНТ (`job_name` в /api/state): экран говорит, ЧТО идёт, и по исходу ведёт туда, куда повёл бы
   экран самого задания. До шага 8b исход вёл всегда в начало — и после F5 посреди установки шаг «пароль панели»
   выпадал: человек проходил до «Панель уже стоит» и открывал панель, в которую нечем войти (ревью шага 8b). */
/* `ok` — экран или функция от итога (у пароля панели следующий экран решает сам ответ роутера). Задание, которого в
   таблице нет (проверка, вход, срез, отчёт), продолжать нечем — кнопка честно зовётся «В начало». */
var RESUME = {
  install:   {t: Lbl('Ставлю панель', 'Installing the panel'), ok: 'panelpw', bad: 'check', step: 2},
  access:    {t: Lbl('Открываю доступ', 'Opening access'), ok: 'login', bad: 'access', step: 1},
  panelpw:   {t: function(){ return pwOnlyJob() ? T('Меняю пароль панели', 'Changing the panel password') : T('Задаю пароль панели', 'Setting the panel password'); },
              ok: function(r){ return pwOnlyJob() ? 'exists' : pwNext(r); }, bad: function(){ return pwOnlyJob() ? 'panelpw-only' : 'panelpw'; }, step: 2},
  rootpw:    {t: Lbl('Меняю пароль root', 'Changing the root password'), ok: 'check', bad: 'rootpw', step: 1},
  storemode: {t: Lbl('Переношу', 'Moving the system'), ok: function(r){ ST.storeDone = r.mode || ''; return 'done'; }, bad: 'done', step: 2},
  remove:    {t: Lbl('Снимаю с роутера', 'Removing from the router'), ok: 'scan', bad: 'remove', step: 2}};
function resumeOf(){ return RESUME[ST.jobName] || null; }
/* Пароль панели меняли с «Панель уже стоит» (не установка): итог — туда же, а не в «Готово» установки. */
function pwOnlyJob(){ return !!(ST.jobCtx && ST.jobCtx.scr === 'panelpw-only'); }
scr('resume', {step: function(){ var j = resumeOf(); return j ? j.step : 2; }, once: true,
 t: function(){ var j = resumeOf(); return j ? j.t() : T('Работа уже идёт', 'A job is already running'); },
 sub: Lbl('Страницу перезагрузили, а задание никуда не делось — вот его вывод.',
          'The page was reloaded, but the job kept going — here is its output.'),
 body: function(){
   /* Куда поведёт исход — говорим, только когда знаем (задание есть в RESUME); иначе исход ведёт в начало. */
   return '<div id="accsteps"></div><div id="res" role="status">' + Rows([{mk: 'run', t: T('Задание выполняется…', 'The job is running…'),
     d: resumeOf() ? T('мастер снова показывает его вывод; исход поведёт туда же, куда повёл бы экран задания',
                       'the wizard is showing its output again; the outcome leads where the job’s own screen would')
                   : T('мастер снова показывает его вывод', 'the wizard is showing its output again')}]) + '</div>' +
     '<div class="wzgap">' + Log('wzlog') + '</div>';
 },
 acts: [],
 enter: function(){
   var res = document.getElementById('res'), acts = document.getElementById('acts'), j = resumeOf();
   /* Маркеры шагов открытия доступа — тем же разбором, что на `access-run`: сырыми строками в логе им не место. */
   watchJob(stepFeed(document.getElementById('accsteps'), document.getElementById('wzlog'))).then(function(r){
     if (r.gone) return;
     res.innerHTML = Rows([{mk: r.ok ? 'ok' : 'no',
       t: r.ok ? T('Задание завершено', 'The job has finished')
               : T('Задание завершилось ошибкой', 'The job failed'),
       d: r.ok ? T('можно продолжать', 'you can carry on')
               : esc(r.error || T('причина — в выводе выше', 'the reason is in the output above'))}]);
     if (ST.jobName === 'access' && r.ok){ if (ST.probe) ST.probe.ssh = true; ST.pwAsked = true; ST.pwWhy = accPwWhy(r); }
     var to = j ? (r.ok ? j.ok : j.bad) : 'scan';
     if (typeof to === 'function') to = to(r);
     actsSet(SP + '<button class="btn pri" data-go="' + to + '">' +
       (j ? T('Продолжить', 'Continue') : T('В начало', 'Start over')) + '</button>');
   }).catch(function(e){
     res.innerHTML = Rows([{mk: 'no', t: e.http ? T('Агент отказал', 'The agent refused') : T('Связь с агентом потеряна', 'Lost contact with the agent'),
       d: esc(e.message)}]);
     /* Не тупик: без кнопки выход был только через новую вкладку. */
     actsSet(SP + '<button class="btn pri" data-go="scan">' + T('В начало', 'Start over') + '</button>');
   });
 }});

/* ═══ 9. ГОТОВО. Мастер кончается здесь: дальше — панель. Три следующих шага НАЗВАНЫ, но не
   продублированы экранами: два места правды разъезжаются всегда. ═══════════════ */
scr('done', {step: 3, t: Lbl('Готово', 'All set'),
 sub: Lbl('Панель работает. Дальше всё — в браузере.',
          'The panel is running. Everything else happens in the browser.'),
 body: function(){
   var url = panelUrl();
   /* Адрес — крупно и моноширинно (макет `wz-done`): его перепечатывают и кладут в закладки. */
   return '<div class="wzurl">' + esc(url) + '</div>' +
     '<div class="cline" style="text-align:center">' +
     T('Логин — admin (он уже подставлен), пароль — тот, что вы задали. Адрес не изменится — можно добавить в закладки.',
       'The user name is admin (already filled in), the password is the one you set. The address will not change — feel free to bookmark it.') +
     '</div>' +
   '<div class="wzgap">' + Rows([
     {mkt: '1', t: T('Компоненты', 'Components'),
      d: T('выбрать протокол — роутер скачает его сам',
           'pick a protocol — the router downloads it by itself')},
     {mkt: '2', t: T('Серверы', 'Servers'),
      d: T('перетащить ссылку vless://, hy2:// или конфиг AmneziaWG',
           'drop in a vless:// or hy2:// link, or an AmneziaWG config')},
     {mkt: '3', t: T('Включить', 'Switch on'),
      d: T('нет своего сервера — включите ByeDPI или Zapret, они работают без него',
           'no server of your own — turn on ByeDPI or Zapret, they work without one')}
   ]) + '</div>' +
   '<div class="wzgap">' +
   /* Обновление настроек не трогало: «VPN пока выключен» там неправда (транспорт работает, как работал). */
   (ST.upd
     ? Note(T('<b>Панель обновлена</b> — настройки, серверы и правила остались прежними, VPN работает, как работал.',
              '<b>The panel is updated</b> — the settings, servers and rules are as they were, and the VPN works as it did.'), 'acc')
     : Note(T('<b>VPN пока выключен</b> — роутер работает как из коробки, пока вы не выберете протокол в панели.',
              '<b>No VPN is on yet</b> — the router behaves as it did out of the box until you pick a protocol ' +
              'in the panel.'), 'acc')) +
   /* Переехавшая на накопитель система — это новое условие эксплуатации, а не деталь установки:
      вынутый накопитель оставляет роутер стоковым. Говорим об этом на последнем экране, который
      человек точно прочтёт, а не только на том, где он выбирал. */
   (ST.storeDone === 'full' ?
     Note(T('<b>Система живёт на накопителе.</b> Не вынимайте его: без него роутер работает как обычный, ' +
            'без VPN, и панель не откроется.',
            '<b>The system lives on the drive.</b> Do not pull it out: without it the router works as a ' +
            'plain router with no VPN, and the panel will not open.'), 'warn') : '') +
   Note(T('Напоминание: всё сделано на ваш страх и риск. Резервную копию настроек умеет делать сама панель ' +
          '(«Роутер» → «Бэкап настроек»), и она же умеет их вернуть.',
          'A reminder: all of this was done at your own risk. The panel itself can back up its settings ' +
          '(“Router” → “Settings backup”) and restore them.'), 'warn') + '</div>';
 },
 acts: [{t: Lbl('Мастер больше не нужен', 'Done with the wizard'), act: 'bye', k: 'gh'},
        {t: Lbl('Открыть панель', 'Open the panel'), act: 'openpanel', k: 'pri'}]});

/* Адрес панели — одна формула на экраны, что его называют («Готово», «Мастер закрыт»). */
function panelUrl(){ return 'http://' + ST.ip + ':8088'; }

/* ═══ МАСТЕР ЗАКРЫТ. Агент уже остановлен (`/api/bye`): экран не ходит к нему ни за чем, а шагов не рисует — закрыть
   мастер можно и до установки. Адрес панели — только если она стоит (поставили сейчас или нашли установленной; снятие сбрасывает
   `ST.conn`): закрывший мастер чаще всего идёт туда, а адрес несуществующей панели звал бы в пустоту. ═══ */
scr('bye', {step: -1, t: Lbl('Мастер закрыт', 'The wizard is closed'),
 sub: Lbl('Агент остановлен. Окно консоли, если осталось открытым, и эту вкладку можно закрыть.',
          'The agent has stopped. You can close the console window if it is still open, and this tab too.'),
 body: function(){
   if (!ST.ip || !(ST.panelUp || (ST.conn && ST.conn.installed))) return '';
   var url = panelUrl();
   return '<div class="cline" style="text-align:center">' + T('Панель: ', 'The panel: ') +
     '<a href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(url) + '</a></div>';
 },
 acts: []});

/* ═══ 10. ПАНЕЛЬ УЖЕ СТОИТ. Мастер обязан это УЗНАТЬ и не предлагать «установить» как
   единственный путь: чаще всего человек пришёл обновиться. ════════════════════ */
scr('exists', {step: 2, t: Lbl('Панель уже стоит', 'The panel is already installed'),
 sub: Lbl('Нашёл установленную панель — покажу, что с ней можно сделать.',
          'Found an installed panel — here is what can be done with it.'),
 body: function(){
   var c = ST.conn || {}, f = ST.facts || {};
   /* Сравниваем ВЕРСИЮ СБОРКИ с версией сборки — номер enodia.py тут не при чём: он про
      другое, и его показ звал «обновиться» на номер меньше того, что стоит (замер 28.08). */
   var mine = c.payload_version || f.payload_version || '';
   var there = c.version || f.version || '';
   var same = mine && there && mine === there;
   /* Не знаем — не утверждаем: «?» стоит с нейтральной точкой, а не с зелёной галочкой (экран открыт без входа — F5,
      «назад» браузера). Транспорт «нет» говорим, только когда роутер нам ответил. */
   var tv = c.transport || f.transport, known = !!(tv || ST.conn || ST.facts);
   /* Строки — как в макете `wz-exists`: номер версии и имя транспорта — в пояснении, чип — только у «Версии у меня», и он
      называет СРАВНЕНИЕ («новее»). Сравниваем номер СБОРКИ (`CODE` из VERSION: агент отдаёт его и за роутер, и за себя), а
      не строку версии — у дев-сборок строка одна, номера разные. Номера нет (срез проверки их не несёт) — чипа нет, а не
      догадка. */
   var mc = parseInt(c.payload_code, 10), tc = parseInt(c.code, 10);
   var rel = same ? 'same' : (mc > tc ? 'new' : (mc < tc ? 'old' : ''));
   var nok = T('не знаю: в этот раз на роутер не входил', 'unknown: I have not signed in to the router this time');
   return Rows([
     {mk: there ? 'ok' : 'wait', t: T('Версия на роутере', 'Version on the router'), d: there ? esc(there) : nok},
     {mk: rel === 'old' ? 'wr' : (mine ? 'ok' : 'wait'), t: T('Версия у меня', 'Version I have'),
      d: (mine ? esc(mine) + ' — ' : '') +
         (same ? T('та же самая: обновлять нечего, но переустановить можно',
                   'the same one: nothing to update, though you can reinstall')
               : T('обновление заменит скрипты и панель, настройки останутся',
                   'an update replaces the scripts and the panel; the settings stay')),
      v: {same: T('та же', 'same'), 'new': T('новее', 'newer'), old: T('старее', 'older')}[rel] || ''},
     {mk: known ? 'ok' : 'wait', t: T('Активный транспорт', 'Active transport'),
      d: tv ? esc(tptName(tv)) + ' · ' + T('настроен в панели, мастер его не трогает',
                                           'configured in the panel — the wizard does not touch it')
            : (known ? T('не выбран — выбирается в панели', 'none chosen — it is picked in the panel') : nok)}
   ]) +
   /* Двери — переходы на экраны мастера (макет `wz-exists`); цвет — раздел панели, к которому действие ближе:
      «Роутер» (установка, диагностика) и «Панель» (её пароль, её снятие). */
   '<div class="wzgap">' + Doors([
     {t: T('Обновить', 'Update'), go: 'check', c: 'var(--g4)', ic: 'i-refresh',
      d: T('Заменить скрипты и панель. Настройки, серверы и правила остаются',
           'Replace the scripts and the panel. Settings, servers and rules stay')},
     {t: T('Переустановить', 'Reinstall'), go: 'check', c: 'var(--g4)', ic: 'i-cpu',
      d: T('То же самое, но целиком — если что-то работает странно',
           'The same thing, but in full — if something behaves oddly')},
     {t: T('Сменить пароль панели', 'Change the panel password'), go: 'panelpw-only', c: 'var(--g5)', ic: 'i-lock',
      d: T('Забыли пароль от :8088 — задайте новый. Установку и настройки не трогаем',
           'Forgot the :8088 password — set a new one. The installation and settings stay untouched')},
     {t: T('Диагностика', 'Diagnostics'), go: 'diag', c: 'var(--g4)', ic: 'i-dl',
      d: T('Собрать отчёт для разбора: что установлено, что живо, что в логах',
           'Collect a report: what is installed, what is alive, what is in the logs')},
     {t: T('Удалить', 'Remove'), go: 'remove', c: 'var(--g5)', ic: 'i-trash',
      d: T('Выключить VPN или снять всё — сначала покажу, что уберётся', 'Switch the VPN off or remove everything — first I show what goes')}
   ]) + '</div>';
 },
 acts: [{t: Lbl('Открыть панель', 'Open the panel'), act: 'openpanel', k: 'pri'}]});

/* ═══ 11. ДИАГНОСТИКА. Отчёт собирает и МАСКИРУЕТ сам роутер: решать, что считать секретом,
   на ПК нельзя — два места правды дадут два разных ответа. ═══════════════════ */
scr('diag', {step: 2, t: Lbl('Диагностика', 'Diagnostics'),
 sub: Lbl('Соберу один файл, который можно приложить к вопросу в чате.',
          'I will collect one file you can attach to a question in chat.'),
 body: function(){
   return Rows([
     {mk: 'ok', t: T('Что собираю', 'What goes in'),
      d: T('версии, состояние подсистем, правила, последние логи',
           'versions, subsystem state, rules, recent logs')},
     {mk: 'ok', t: T('Что вырезаю', 'What is stripped out'),
      d: T('ключи, пароли, адреса серверов и внешний IP — маскирует сам роутер',
           'keys, passwords, server addresses and the external IP — masked by the router itself')}
   ]) +
   '<div class="wzgap">' + Note(T('Отчёт собирается <b>на роутере</b> и им же маскируется. Всё равно просмотрите файл ' +
     'перед публикацией: маскировка эвристическая.',
     'The report is collected <b>on the router</b> and masked there. Look through the file before ' +
     'posting it anyway: the masking is heuristic.'), 'info') + '</div>' +
   '<div id="res" role="status"></div>';
 },
 acts: [{t: Lbl('Назад', 'Back'), go: 'exists', k: 'gh', bk: 1},
        {t: Lbl('Собрать отчёт', 'Collect the report'), act: 'diag', k: 'pri'}],
 enter: function(){
   if (!REPAINT){ ST.diagDone = null; return; }
   if (ST.diagDone) document.getElementById('res').innerHTML = diagHtml(ST.diagDone);
 }});
function diagHtml(d){
  return '<div class="wzgap">' + Rows([{mk: 'ok', t: T('Отчёт готов', 'The report is ready'), d: esc(d.path), v: d.kb + T(' КБ', ' KB')}]) +
    '</div><div class="wzgap"><button class="btn" data-act="openfile">' + T('Открыть файл', 'Open the file') + '</button></div>';
}

/* ═══ 12. СНЯТИЕ. Два варианта, и они РАЗНЫЕ по последствиям. План того, что будет снято,
   спрашиваем у роутера: там единственная истина, и она меняется вместе с подсистемами. ══ */
/* Заголовок — «Удалить», а не «Снять»: так это действие названо и в меню ПК-программы
   (`action_uninstall`), и в обоих README. Карточка на экране «панель уже стоит» ведёт сюда, и
   расходиться с тем, что человек нажал, экран не имеет права. */
scr('remove', {step: 2, picks: ['rm', 'sure'], t: Lbl('Удалить с роутера', 'Remove from the router'),
 sub: Lbl('Сначала посмотрим, что именно уберётся.', 'First, a look at what exactly goes away.'),
 body: function(){
   return '<div id="res" role="status">' + Rows([{mk: 'run', t: T('Спрашиваю роутер…', 'Asking the router…'),
     d: T('что установлено и что будет снято', 'what is installed and what will be removed')}]) + '</div>' +
     '<div class="wzgap" id="extra"></div>';
 },
 acts: [{t: Lbl('Назад', 'Back'), go: 'exists', k: 'gh', bk: 1}],
 enter: function(){
   /* Смена языка рисует экран из сеанса: план роутера и исход уже известны, а новый план — это заливка uninstall.sh. */
   if (REPAINT && ST.rm) return rmPaint();
   ST.rm = null;
   runJob('/api/removeplan', {}).then(function(r){
     if (r.gone) return;
     ST.rm = {plan: r, done: null, log: []};
     rmPaint();
   }).catch(function(e){
     /* Отказ плана — тоже в сеанс: смена языка иначе звала бы план заново (заливку uninstall.sh). */
     ST.rm = {plan: {ok: false, lost: {message: e.message, http: e.http}}, done: null, log: []};
     rmPaint();
   });
 }});

/* Экран снятия ЦЕЛИКОМ из сеанса (`ST.rm`): план роутера, выбор, исход. Один художник на вход и на смену языка. */
function rmPaint(){
  var res = document.getElementById('res'), extra = document.getElementById('extra'), r = ST.rm.plan, dn = ST.rm.done;
  /* Вывод удаления — из сеанса: итог «смотрите вывод ниже» без самого вывода — отсылка в пустоту. */
  var logBack = function(){ if (ST.rm.log && ST.rm.log.length) logPush(document.getElementById('wzlog'), ST.rm.log); };
  if (!r.ok){ res.innerHTML = Note(r.lost ? failTxt(T('Не смог спросить роутер: ', 'Could not ask the router: '), r.lost)
                                          : esc(r.error || T('Не смог спросить роутер', 'Could not ask the router')), 'bad'); return; }
  if (dn){
    res.innerHTML = rmDoneRow(dn);
    if (dn.ok){
      extra.innerHTML = '<div class="wzgap">' + Log('wzlog') + '</div>';
      logBack();
      actsSet(SP + '<button class="btn pri" data-go="scan">' + T('В начало', 'Start over') + '</button>');
      return;
    }
  } else res.innerHTML = rmPlanRows(r);
  extra.innerHTML = rmExtraHtml();
  logBack();
  /* Разметку экрана дорисовали ПОСЛЕ render() — значит и кнопку с её запертостью ставим сами:
     syncNeed() отработал, когда этих узлов ещё не было. */
  rmActs();
}
/* Отказ ДО начала (`started: false` — нет связи, роутер занят установкой кода или снятием) — не «снялось не всё»: роутер не
   тронут, и строка говорит это вместе с ПРИЧИНОЙ от агента (ревью ветки pkg-update, круг 3). */

                        d: esc(dn.message || ''), v: dn.full ? T('удалено', 'removed') : T('выключено', 'off')}
                     : dn.started === false
                     ? {mk: 'no', t: T('Снятие не начиналось — роутер не тронут', 'The removal did not start — the router is untouched'),
                        d: esc(dn.message || T('смотрите вывод ниже', 'see the output below')), v: '—'}
                     : {mk: 'no', t: T('Снялось не всё', 'Not everything was removed'),

}
function rmPlanRows(r){

        v: T('строк: ', 'lines: ') + (p.cron == null ? '?' : p.cron)},

        d: T('свежий залить не вышло: может не знать про часть подсистем',

}
function rmExtraHtml(){
     /* ПОРЯДОК ЗДЕСЬ — ЧАСТЬ ЗАЩИТЫ. Совет «сделайте бэкап» и галочка стоят ПЕРЕД выбором:
        прочитать их после клика поздно, а «удалить полностью» необратимо. Галочка же и

              'Сделайте её до удаления: файловая копия с компьютера этого не умеет.',

              'removing anything: a file copy from the computer cannot do that.'), 'warn') +
