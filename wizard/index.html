<!DOCTYPE html>
<!-- data-theme В РАЗМЕТКЕ НЕ ПИШЕМ: прибитый атрибут делает ветку prefers-color-scheme мёртвым
     кодом (это уже случалось — мастер светил белым в тёмной системе, хотя панель, куда он
     ведёт, тему уважает). Атрибут ставит ПЕРЕКЛЮЧЕНИЕ ТЕМЫ, и только когда человек выбрал
     светлую или тёмную руками; «как в системе» его снимает и отдаёт решение медиа-условию.
     Довод «мастеру своего переключателя не надо, он живёт один сеанс» не выдержал: система и
     привычка расходятся чаще, чем кажется, а установка идёт в самом ярком окне на экране. -->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enodia</title>   <!-- язык ставит paintChrome(): статический заголовок обязан быть нейтральным -->
<!--
  СТРАНИЦА МАСТЕРА УСТАНОВКИ. Её отдаёт локальный агент (`enodia.py --wizard`), он же ходит
  на роутер: браузер сам по SSH не умеет. Гарды агента (слушаем только 127.0.0.1, токен у
  всех /api/*, сверка Host от DNS-rebinding) живут в enodia.py — здесь их видно лишь по тому,
  что токен уезжает ЗАГОЛОВКОМ, а из адресной строки убирается сразу.

  ГРАНИЦА МАСТЕРА (решение 28.08.2026): довёл до панели и предложил её открыть. Протокол,
  серверы, сайты и проверка «работает ли» живут в ПАНЕЛИ и повторяться здесь не должны —
  два места правды разъезжаются всегда (это уже случилось с CLI-меню и панелью).

  ЧЕГО ЗДЕСЬ НЕТ И НЕ БУДЕТ: своей арифметики и своих вердиктов. Страница ПОКАЗЫВАЕТ то,
  что сказал агент (а тот — то, что сказал роутер). «Роутер не ответил» ≠ «всё плохо»:
  такие ответы разведены по разным строкам, а не слиты в один индикатор.

  МАТЕРИАЛ — ПАНЕЛИ, И НЕ КОПИЕЙ (шаг 8b, 24.09.2026). Карточка, строки-факты, плитки выбора,
  двери, поля, кнопки, плашки, консоль, токены обеих тем и шрифт — это `web/assets/panel.css`,
  который отдаёт агент (`/assets/…`, список в enodia.py::WIZARD_ASSETS). До 8b у мастера была
  СВОЯ копия материала — и она разъехалась: мастер жил на палитре до редизайна, тёплой бумагой
  рядом с холодной панелью, куда он ведёт. Установка и панель — один продукт, человек не должен
  чувствовать пересадку. Своё у страницы — только раскладка (`.wz*`: колонка, шапка, степпер,
  заставка) и то, чего у панели нет вовсе (галочка согласия, поле с глазом, окраска лога).
  Знаки спрайта ниже — КОПИИ символов `web/index.html` (у <use> нет ссылки на символ внутри
  HTML-документа); сверяет их, подключение стилей и список агента проверка C110.
  Эталон вида — макет `local/redesign-proto.html`, экраны `wz-*`. Без CDN и без сборки.
-->
<link rel="stylesheet" href="/assets/panel.css">
<script>
/* ТЕМА ДО ПЕРВОЙ ОТРИСОВКИ. Основной скрипт стоит в конце страницы, а браузер рисует разметку раньше: человек с ручной
   тёмной темой при светлой системе видел бы вспышку белого — самой заметной части страницы. Здесь — только чтение выбора;
   переключатель и запись живут ниже (`applyTheme`). Хранилище может быть запрещено — тогда тема «как в системе». */
(function(){ try { var t = localStorage.getItem('enodia_theme');
  if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {} })();
</script>
<style>
/* РАСКЛАДКА МАСТЕРА — всё своё у страницы. Цвета — ТОЛЬКО токенами panel.css (сверяет C110): своих
   значений здесь нет, иначе мастер снова уедет от панели на первой же правке палитры. Исключение одно —
   окраска строк лога: плашка консоли тёмная в обеих темах (`.term` панели), и её цвета темы не знают. */
body{min-height:100vh}
/* Колонка шириной в карточку страниц вне панели (560, как вход и заглушка): мастер — страница «до
   панели», и выглядеть он обязан так же, как они, а не как панель без сайдбара. */
.wz{max-width:560px;margin:0 auto;padding:36px 18px 44px;display:flex;flex-direction:column;gap:14px}
/* ШАПКА: знак и имя, язык, тема, чип агента. Переносится строкой ниже, когда не влезает, — на
   ширине колонки чип уходит под переключатели (макет `wz-*` так и рисует). */
.wzhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--ink2)}
.wzfill{flex:1 1 0}
.wzbrand{display:flex;align-items:center;gap:9px;font-weight:500;color:var(--ink);letter-spacing:.04em;white-space:nowrap}
.wzmk{width:28px;height:28px;filter:var(--mark-glow)}
/* Переключатели — вкладки-пилюли панели (`.tabs2>.seg`, `Tabs` макета: выбранная — тёмной заливкой), своей плотности нет.
   До шага 7 пачки 5 это были сегменты в треке (`.segbar`, выбранная — белая с тенью) — шапка мастера была единственным
   местом, где язык и тема выглядели не так, как в макете. Тема — иконками: три слова («Как в системе» / «Светлая» /
   «Тёмная») в шапку не влезают ни в одном из языков, а смысл у иконок читается без перевода; подпись есть в title и
   aria-label, и она переводится. */
.wzsg svg{width:15px;height:15px;display:block;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
/* ВЫБОР ЯЗЫКА НА ЗАСТАВКЕ — две плитки (`Pick` макета), выбранная — зелёной рамкой на мягком зелёном. У панели такого
   элемента нет (язык она берёт у роутера), поэтому разметка своя, а цвета — токены panel.css. */
.wzpick{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.wzpick .wzp{display:inline-flex;align-items:center;gap:8px;padding:9px 13px;border-radius:11px;border:1.5px solid var(--line);
             background:var(--card);font-size:13.5px;color:var(--ink);cursor:pointer}
@media (hover:hover){ .wzpick .wzp:hover{border-color:var(--line2)} }
.wzpick .wzp.on{border-color:var(--acc);background:var(--acc-soft);color:var(--acc-deep);cursor:default}
.wzpick .wzp:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wzpick .wzp.dis{opacity:.4;cursor:not-allowed}
/* Смена языка перерисовывает экран, а экраны с идущим заданием перерисовывать нельзя (это
   запустило бы установку второй раз). Там переключатель ВИДЕН, но заперт (`.seg.dis` панели:
   бледный, курсор «нельзя», подсказка — почему): спрятать его значило бы заставить человека искать,
   куда он делся. Щелчок по запертому глушит обработчик, а не `pointer-events` — иначе не видно ни
   курсора, ни подсказки (ревью шага 8b). */
/* СТЕППЕР — четыре шага кружками с номером (макет `wz-*`). «Доступ» — отдельный шаг: это
   единственное место во всей установке, где трогают прошивку роутера. Текущий — цветом главной
   кнопки (`--pri`/`--pri-ink`: белый на `--acc` в «Ночи» не читается), пройденный — мягким
   зелёным с галочкой. */
.wzsteps{display:flex;gap:6px;flex-wrap:wrap}
/* Пустой степпер (заставка, «агент не отвечает») — не узел раскладки: иначе колонка ставит лишний зазор над карточкой. */
.wzsteps:empty{display:none}
.wzst{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink3);padding:5px 10px 5px 6px;border-radius:99px;background:var(--soft)}
.wzst i{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;line-height:1;background:var(--soft2);color:var(--ink2)}
.wzst.on{color:var(--ink);background:var(--acc-soft);font-weight:500}
.wzst.on i{background:var(--pri);color:var(--pri-ink)}
.wzst.done{color:var(--ink2)}
.wzst.done i{background:var(--acc-soft);color:var(--acc-deep);font-weight:600}
/* КАРТОЧКА ШАГА — `.card` панели с ЕЁ полями (`.card.pad` макета, 14/16/13). До шага 7 пачки 5 — поля страниц вне панели
   (`.bare-card`, 30/28/26): у мастера макет рисует обычную карточку, и колонка текста была уже на 24 px. Межстрочный у
   заголовка — макета (22 × 1,5), а не плотный `.bh1` страниц вне панели. */
.wzcard{min-width:0}
.wzh1{font-size:22px;line-height:1.5;outline:none}
.wzbody{margin-top:14px}
.wzacts{margin-top:18px}
.wzi{padding:10px 12px;font-size:14px}
.wzgap{margin-top:14px}
#accsteps:not(:empty),#res:not(:empty){margin-top:14px}
.wzfoot{font-size:12px;color:var(--ink3);text-align:center}
.wzfoot code,.note2 code{font-family:var(--font-mono);font-size:12px}
/* ЗАСТАВКА — первый кадр мастера. Композиция — заставки панели (знак 120 px НАД словом, слово
   в разрядку, янтарная линия «как в hero»): кадр, с которого человек начинает, обязан быть тем
   же, каким он продолжит. Линия — символ `lg-uline` и правило `.bname .uline` панели. */
.wzsplash{display:flex;flex-direction:column;align-items:center;gap:14px;padding:26px 0 8px;text-align:center}
.wzmkb{width:120px;height:120px;filter:var(--mark-glow-big)}
.wzbn{font-size:25px;font-weight:500;letter-spacing:.16em}
.wzlead{max-width:420px;margin-top:10px}
.wzsplash .wzgo{margin-top:6px}   /* кнопка обычного размера, как в макете: крупная спорила бы со знаком */
.wzpre{margin-top:4px}
/* АДРЕС ПАНЕЛИ на «Готово» — крупно и моноширинно: его перепечатывают и кладут в закладки. */
.wzurl{font-size:19px;font-weight:600;font-family:var(--font-mono);background:var(--soft);border-radius:var(--r);padding:12px 16px;text-align:center;word-break:break-all;color:var(--ink)}
/* СТРОКИ-ФАКТЫ — `.lrow` панели: знак состояния слева, значение — чипом справа. Мастер ПОКАЗЫВАЕТ,
   что увидел: «проверка прошла» без чисел не даёт человеку ни одного способа поспорить. Цвет несёт
   и знак, и чип — у строки без значения другого признака состояния нет. Вес и размер знака — `.lrow .av` панели (15 px,
   обычный), как в макете: жирный знак и номер шага были своими у мастера (шаг 7 пачки 5). */
.lrow .av.wzok{background:var(--acc-soft);color:var(--acc-deep)}
.lrow .av.wzno{background:var(--bad-soft);color:var(--bad)}
.lrow .av.wzwr{background:var(--warn-soft);color:var(--warn)}
.lrow .av.wzrun::after{content:"";width:14px;height:14px;border-radius:50%;border:2px solid var(--acc);border-right-color:transparent;animation:wzspin .8s linear infinite}
@keyframes wzspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){ .lrow .av.wzrun::after{animation:none;border-right-color:var(--acc)} }
.wzr>.wzv{flex:none;max-width:60%;white-space:normal;text-align:right}
/* Плитки выбора — `.opt` панели; трёх в ряд хватает по ширине колонки, на телефоне — две (третья переносится, макет). */
.wzopt.o3{grid-template-columns:repeat(3,minmax(0,1fr))}
/* Галочка СОГЛАСИЯ — не тумблер: согласие не «настройка с немедленным действием», а подпись под
   прочитанным. Мягкая плашка — чтобы её не проскочить глазами. Стоит СРАЗУ после предупреждения,
   и без отступа две мягкие плашки читались одним блоком (поймано глазами 02.09.2026) — отступ живёт
   в правиле, а не обёрткой у места вызова: обёртку забывали дважды. */
.wzchk{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:var(--r);background:var(--soft);cursor:pointer;font-size:12.5px;line-height:1.55;color:var(--ink2)}
.wzchk input{margin:2px 0 0;width:16px;height:16px;flex:none;accent-color:var(--acc);cursor:pointer}
.note2+.wzchk{margin-top:14px}
.note2+.note2{margin-top:9px}
.note2.acc{background:var(--acc-soft);color:var(--acc-deep)}
/* Настройка шага (снять копию прошивки, поставить перевод) — тумблер `.sw` панели СЛЕВА и одна мелкая строка рядом
   (`WChk` макета): это оговорка к выбранной плитке, а не строка-факт, и весить как факт (имя 14/500 + пояснение, тумблер
   справа — так было до шага 7 пачки 5) она не должна. Вся строка — подпись поля: нажать можно по тексту. */
.wzsw{display:flex;align-items:center;gap:9px;margin-top:10px;cursor:pointer}
.wzsw .wzswt{min-width:0;color:var(--ink2)}
/* ПОЛЕ ПАРОЛЯ: набранного не видно, а ошибиться в нём легче всего — даём посмотреть ГЛАЗАМИ.
   Место под кнопку освобождаем в самом поле, иначе длинный пароль уезжает под неё. */
.wzinp{display:block;position:relative;margin-top:4px}
.wzinp.pw .wzi{padding-right:42px}
.wzeye{position:absolute;top:0;right:0;height:100%;width:40px;display:flex;align-items:center;justify-content:center;
       background:none;border:0;padding:0;border-radius:var(--r-md);cursor:pointer;color:var(--ink3)}
@media (hover:hover){ .wzeye:hover{background:none;color:var(--ink2)} }
.wzeye:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.wzeye svg{width:19px;height:19px;display:block}
.wzeye .wzsl{display:none} .wzeye.off .wzsl{display:inline}
.wzhint{display:block;margin-top:5px;font-size:12px;color:var(--ink3);line-height:1.45}
/* Пара полей нового пароля — ДРУГ ПОД ДРУГОМ и ОДНА подсказка под обеими (макет): в две колонки подсказка резалась на две
   половины одной фразы, и вторая читалась правилом только для «Ещё раз». Обёртка нужна `pwDonePaint`: он убирает её целиком. */
.wztwo>.wzhint{margin-top:4px}
.wzchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
/* Чип-обещание длиннее строки на 320 px («Wi-Fi и настройки сети остаются вашими») — переносится, а не режет край карточки. */
.wzcp{white-space:normal}
/* ЛОГ ЗАДАНИЯ — консоль панели (`.term`). Пустой не показываем ВООБЩЕ: тёмная полоса на светлом
   экране читается как цензурная плашка, а не как «сюда придёт вывод»; вместе с ним прячем и
   подпись над ним (она про строки, которых ещё нет). Метки [ OK ]/[WARN]/[FAIL] красим: в
   сплошной простыне отказ иначе приходится ИСКАТЬ глазами. */
.wzlh{margin:0 0 6px}
.wzt{max-height:240px;min-height:0}
/* Два правила, а не одно через запятую: браузер без `:has()` выбросил бы правило ЦЕЛИКОМ — и пустая тёмная
   плашка стала бы видна; отдельное `:empty` работает везде. */
.wzt:empty{display:none}
.wzlog:has(.wzt:empty){display:none}
.term .wzl-ok{color:#7fbf9d} .term .wzl-wr{color:#d2ab60} .term .wzl-bad{color:#dd8b76}
.term .wzl-sec{color:#e8e5d8;font-weight:600}
/* УЗКОЕ ОКНО — как макет на телефоне: шапка переносится во вторую строку и НИЧЕГО не прячет (до шага 7 пачки 5 уступали
   подпись «· установка» и чип агента — макет держит обоих), значение строки-факта остаётся чипом СПРАВА (уводить его под
   пояснение макет не рисует; длинное значение переносится внутри чипа — `.wzr>.wzv` выше), плиток раскладки — две в ряд. */
@media (max-width:520px){
  .wz{padding:22px 14px 34px}
  .wzmkb{width:88px;height:88px}
  .wzbn{font-size:21px}
  .wzopt.o3{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:360px){ .wzopt,.wzopt.o3{grid-template-columns:minmax(0,1fr)} }   /* карточка уже 300 px — плитки столбиком, как `@container card (max-width:300px)` макета */
</style>
</head>
<body>
<!-- СПРАЙТ. Знак — ОДНА копия геометрии на всю страницу (шапка 28 px и заставка 120 px ставят её
     через <use>), та же, что `lg-mark` панели и заглушки (сверяет C45). Знаки дверей и плиток и
     линия под словом — копии символов `web/index.html` (сверяет C110). Цвет третьего кольца —
     правило `.cc` и токен `--mark-ink` panel.css. Спрятан размером, а не `display:none`: у скрытого
     так маски и фильтр знака мертвы. -->
<svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">

<script>
/* ─── агент: токен, запросы, задания ─────────────────────────────────────────
   Токен приходит в адресе ОДИН раз. Убираем его из строки браузера сразу: адрес видно на
   скриншотах и в истории, а секрет там не нужен — дальше он уезжает заголовком. */
var TOKEN = new URLSearchParams(location.search).get('t') || '';
if (TOKEN) {
  history.replaceState(null, '', location.pathname);
  try { sessionStorage.setItem('enodia_wizard_token', TOKEN); } catch (e) {}
} else {
  /* F5 — самое обычное движение человека, а токена в адресе уже нет: мы его оттуда сами и
     убрали. Без него страница честно показывала «Агент не отвечает», хотя агент жив, и
     лечилось это только возвращением в окно консоли за ссылкой (ЗАМЕР В БРАУЗЕРЕ 02.09.2026).
     Держим копию в sessionStorage: он привязан к ORIGIN, а origin у каждого запуска свой —
     порт мастер просит у ОС ⇒ чужому агенту ключ не подойдёт, вкладка переживает перезагрузку,
     а закрытие вкладки его уносит. Хранилище может быть запрещено (приватный режим, политика) —
     тогда всё работает ровно как раньше. */
  try { TOKEN = sessionStorage.getItem('enodia_wizard_token') || ''; } catch (e) {}
}

/* ─── язык: русский / английский ─────────────────────────────────────────────
   ПАРА СТОИТ В МЕСТЕ ИСПОЛЬЗОВАНИЯ: T('Найдём роутер', 'Let us find your router'). Словарь с
   ключами на дальнем конце файла разъезжается молча — строку правят, ключ остаётся, и человек
   видит английский там, где ждал перевода. Пара видна в ревью, а её отсутствие видит проверка
   в сборке: русский литерал вне T() = непереведённая строка.

   ПЕРВЫЙ ЯЗЫК БЕРЁМ У БРАУЗЕРА и не угадываем дальше него: `ru` → русский, всё остальное →
   английский. Присваивать русский всем соседним локалям — значит решать за человека; для
   этого на заставке стоит переключатель, и он же первое, что видно.
   Ключ хранилища — ТОТ ЖЕ, что у панели (`enodia_lang`), но ОБЩЕГО ЗНАЧЕНИЯ У НИХ НЕТ, и
   даже между запусками мастера оно не живёт: агент слушает порт, который выдала ОС, то есть
   каждый запуск — свой origin со своим localStorage. Хранилище тут — память В ПРЕДЕЛАХ сеанса
   (перезагрузил вкладку — язык на месте), не больше. Выбор переживает мастер по другому
   каналу: он уезжает НА РОУТЕР (`INSTALL_LANG` → `lang=` в `.prefs`), и панель читает язык
   оттуда — установленная английским мастером панель откроется английской. */
var LANG = 'ru';
try {
  var _sv = localStorage.getItem('enodia_lang');
  LANG = (_sv === 'en' || _sv === 'ru') ? _sv : (/^ru\b/i.test(navigator.language || '') ? 'ru' : 'en');
} catch (e) { LANG = /^ru\b/i.test(navigator.language || '') ? 'ru' : 'en'; }
function T(ru, en){ return LANG === 'en' ? en : ru; }
/* Заголовок экрана, подпись и надпись кнопки живут в описании экрана — то есть вычисляются
   ОДИН раз, а язык меняется потом. Поэтому там хранится не строка, а пара, и рендер зовёт её
   как функцию: Lbl('Найдём роутер', 'Find your router'). Тело экрана (body) — уже функция,
   ему хватает обычного T(). */
function Lbl(ru, en){ return function(){ return T(ru, en); }; }

function req(method, path, params, body){
  var u = path + (params ? '?' + new URLSearchParams(params).toString() : '');
  /* Язык уезжает АГЕНТУ на каждом запросе: его строки идут в тот же лог, что и наши, и
     разноязычный лог хуже одноязычного любого. Заголовком, а не параметром: параметр видно
     в адресной строке и в логах, а язык — часть сеанса, а не адреса. */
  var o = {method: method, headers: {'X-Wizard-Token': TOKEN, 'X-Wizard-Lang': LANG}};
  if (body){ o.headers['Content-Type'] = 'application/json'; o.body = JSON.stringify(body); }
  /* Чип агента — ФАКТ последнего запроса, а не старта: агент умер посреди работы — шапка обязана это сказать (до круга 2
     ревью 8b она оставалась зелёной, а отказ читался «роутер не ответил»); ожил — снова зелёная. */
  return fetch(u, o).then(function(r){
    if (ENV.k === 'dead' && ENV.v){ ENV.k = 'ok'; paintEnv(); }
    return r.json().catch(function(){ return {}; }).then(function(j){
      /* `http` — агент ОТВЕТИЛ отказом (409 «уже идёт», 403…): это не «связь потерялась», и экран обязан
         сказать это другими словами (`lostTxt`). */
      if (!r.ok){ var er = new Error(j.error || (T('ошибка ', 'error ') + r.status)); er.http = r.status; throw er; }
      return j;
    });
  }, function(e){ if (ENV.k === 'ok'){ ENV.k = 'dead'; paintEnv(); } throw e; });
}
var api  = function(path, params){ return req('GET', path, params, null); };
/* Отказ посреди работы — словами того, что случилось: агент ответил отказом или связь с ним оборвалась. */
/* Отказ действия — словами того, кто отказал: ответил агент (`e.http`) — его текст за нашей приставкой, не ответил — `lostTxt`.
   Прежде «Не смог проверить: Failed to fetch» читалось как «роутер не ответил», хотя молчал агент. */
function failTxt(pre, e){ return (e && e.http) ? pre + esc(e.message) : lostTxt(e); }
function lostTxt(e){
  return (e && e.http ? T('Агент отказал: ', 'The agent refused: ') : T('Связь с агентом потерялась: ', 'Lost contact with the agent: ')) +
    esc(e && e.message); }
var post = function(path, body){ return req('POST', path, null, body || {}); };

/* Задание = фоновое действие агента (заливка, установщик, дамп). Опрашиваем его, пока идёт,
   и отдаём строки вызывающему ПО МЕРЕ появления: человек должен видеть живой вывод, а не
   крутилку — та же причина, по которой он виден в консоли. */
/* ЗАМОК ЯЗЫКА — СЧЁТЧИКОМ ДЕРЖАТЕЛЕЙ, а не флагом (ревью шага 8b). Держат его ожидание ответа агента
   (`runJob` от POST до исхода), опрос задания (`watchJob`) и проба роутера (`act('probe')`); флаг, который каждый
   снимал за себя, отпирал язык посреди ЧУЖОГО задания: отказ второго запроса («уже идёт») ставил JOB_RUN=false,
   пока удаление ещё шло, — смена языка перерисовывала экран, и итог удаления терялся. */
var JOB_N = 0;
function jobHold(){ JOB_N++; JOB_RUN = true; paintLang(); }
function jobFree(){ JOB_N = Math.max(0, JOB_N - 1); JOB_RUN = JOB_N > 0; paintLang(); }
/* «Агент освободился от НАШЕГО задания» — обещание, которое никогда не отказывает. Следующее задание страница
   ставит за ним в очередь, а не шлёт поверх: агент держит ОДНО задание (второе — 409), и отказ «уже идёт» читался
   человеком как «связь с агентом потерялась». */
var JOB_P = null;
/* Сколько заданий запущено С КАКОГО показа экрана (ключ — RENDER_SEQ): плитки экрана заперты только его собственными
   заданиями. По общему замку плитки «Доступа» молчали, пока доживал автовход с экрана пароля (ревью шага 8b, круг 2). */
var JOB_OWN = {};
var PROBE_BUSY = false;   /* проба роутера летит — см. act('probe') */
/* Наблюдать за УЖЕ ИДУЩИМ заданием — тот же опрос, но БЕЗ старта. Нужен ровно там, где
   страницу перезагрузили посреди работы: задание крутится в агенте, а вкладка о нём не знала и
   уходила на #welcome — человек терял и прогресс, и результат (поймано на живом стенде
   02.09.2026). Второй копии цикла не заводим: runJob ниже зовёт этот же watchJob после POST. */
function watchJob(onLine, seq, queued){
  /* `seq` — снимок RENDER_SEQ, СДЕЛАННЫЙ ВЫЗЫВАЮЩИМ. У runJob он снимается ДО POST, и это не
     мелочь: экран можно сменить, пока запрос летит, и результат обязан достаться тому экрану,
     который задание начал (иначе таблица «проверки» приезжает на «Диагностику» — воспроизведено
     31.08.2026). Свой снимок берём только когда за заданием пришли БЕЗ него (экран resume). */
  if (seq === undefined) seq = RENDER_SEQ;
  jobHold();
  var since = 0, gone = false, miss = 0;
  var p = new Promise(function(resolve, reject){
    (function tick(){
      api('/api/job', {since: since}).then(function(j){
        miss = 0;
        since = j.next;
        /* Экран сменили — ничего больше не рисуем (узлы чужие), но задание на роутере ИДЁТ: опрос продолжается
           молча до его конца, и замок держится до него же. Бросить опрос значило бы отпереть язык и следующее
           действие поверх занятого агента. */
        if (seq !== RENDER_SEQ) gone = true;
        if (!gone && onLine && j.lines.length) onLine(j.lines);
        if (j.state === 'run') return setTimeout(tick, 600);
        if (gone) return resolve({ok: false, gone: true});
        var out = j.result || {};
        if (!('ok' in out)) out.ok = (j.state === 'ok');
        out.name = j.name;
        resolve(out);
      }).catch(function(e){
        /* ОДИН сорванный опрос — не конец задания: агент на роутере работает дальше (обрыв сокета, занятый порт
           Windows). Прежде первый же сбой хоронил живое удаление: «не смог снять», кнопка открыта, повтор — «уже
           идёт» (ревью шага 8b, круг 2). Терпим несколько подряд, отказ АГЕНТА (e.http) — сразу. */
        if (!e.http && ++miss < 4) return setTimeout(tick, 1000);
        reject(e);
      });
    })();
  });
  var done = p.then(function(v){ jobFree(); return v; }, function(e){ jobFree(); throw e; });
  /* Очередь ведёт тот, кто задание ЗАПУСТИЛ (`runJob` ставит её сразу, ещё до POST); сюда — только наблюдение за чужим
     заданием (экран resume), иначе наблюдение затёрло бы очередь, собранную позже. */
  if (!queued) JOB_P = done.then(function(){}, function(){});
  return done;
}

function runJob(path, body, onLine){
  /* Снимок ДО POST: пока запрос летит, экран могли сменить — см. разбор в watchJob. */
  var seq = RENDER_SEQ;
  /* Пока задание идёт, экран перерисовывать нельзя — а смена языка это и делает. Замок
     ставим здесь, в одном месте на все задания: иначе про него забудут на первом же новом.
     Ставим ЕЩЁ ДО POST: запрос может лететь секунды, и всё это время задание уже началось. */
  jobHold();
  JOB_OWN[seq] = (JOB_OWN[seq] || 0) + 1;
  var prev = JOB_P || Promise.resolve();
  /* А ДАЛЬШЕ — ТОТ ЖЕ watchJob: цикл опроса, разбор исхода и снятие замка живут В ОДНОМ месте.
     Своя копия цикла здесь была до 02.09.2026 — ровно та, про которую комментарий рядом уже
     утверждал «второй копии не заводим»; ревью нашло, что копий было две. */
  var job = prev.then(function(){
    /* Пока ждали прошлое задание, экран сменили — это задание уже никому не нужно: не стартуем. */
    if (seq !== RENDER_SEQ) return {ok: false, gone: true};
    /* Что менялось на роутере в этом сеансе — для честной строки «пока мастер только смотрит» у поиска роутера. */
    if (/^\/api\/(access|rootpw|install|panelpw|storemode|remove)$/.test(path)) ST.touched = true;
    /* С какого экрана и в каком режиме начато задание — в хранилище вкладки: имя задания агент знает, а экран — нет
       (`panelpw` у установки и у «Сменить пароль панели» одно), и F5 вёл смену пароля в «Готово» установки, а
       обновление — к паролю панели без «Оставить прежний» (ревью шага 8b, круг 3). */
    try { sessionStorage.setItem('enodia_wizard_job', JSON.stringify({scr: CUR, upd: !!ST.upd})); } catch (e) {}
    return post(path, body).then(function(){ return watchJob(onLine, seq, true); });
  /* Отказ ушедшего экрана — тоже «ушёл»: опрос бросает после четырёх сбоев сети и для экрана, с которого ушли, а
     `catch` вызывателя брал `#res`/`#acts` ТЕКУЩЕГО экрана — «Связь потерялась» и чужие кнопки на экране входа (ревью
     шага 8b, круг 3). */
  }).then(function(v){ JOB_OWN[seq]--; jobFree(); return v; },
          function(e){ JOB_OWN[seq]--; jobFree(); if (seq !== RENDER_SEQ) return {ok: false, gone: true}; throw e; });
  /* В очередь — СРАЗУ, а не после ответа на POST: действие, нажатое, пока POST летит, иначе ушло бы вторым POST'ом
     поверх занятого агента (поймано стендом `wizard-jobseq-test`, шаг 8b). */
  JOB_P = job.then(function(){}, function(){});
  return job;
}

/* ─── мелкие сборки разметки (второй копии не заводить) ──────────────────── */
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
  return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }
/* Строка-факт — `.lrow` панели (макет `wz-*`): знак состояния (✓ ok · ✕ no · ! wr · номер шага `mkt` ·
   крутилка run · «·» wait), имя, пояснение, значение — чипом того же цвета. */
function Rows(a){ return '<div class="wzrows">' + a.filter(Boolean).map(function(r){
  var m = r.mk || (r.mkt ? 'num' : 'wait');
  var sign = {ok: '✓', no: '✕', wr: '!', wait: '·', num: r.mkt || ''}[m] || '';
  return '<div class="lrow wzr"><div class="av wz' + m + '">' + sign + '</div>' +
    '<div class="grow wzg"><div class="nm">' + r.t + '</div>' + (r.d ? '<div class="ds">' + r.d + '</div>' : '') + '</div>' +
    (r.v ? '<span class="chip wzv' + ({ok: ' acc', wr: ' wr', no: ' bd'}[m] || '') + '">' + esc(r.v) + '</span>' : '') +
    '</div>'; }).join('') + '</div>'; }
/* Плашка — `.note2` панели. Вариантов пять: info · warn · bad · acc (успокаивающее: «VPN не включается») и
   ok — синоним acc (успех на месте). */
function Note(t, k){ return '<div class="note2' + (k ? ' ' + (k === 'ok' ? 'acc' : k) : '') + '">' + t + '</div>'; }
/* Знак из спрайта — одной записью, как `icUse` панели; рядом с текстом он только украшает. */
function Ic(id, cls){ return '<svg class="ic' + (cls ? ' ' + cls : '') + '" aria-hidden="true"><use href="#' + id + '"/></svg>'; }
/* Раздвижка ряда кнопок: всё, что после неё, — к правому краю (`.acts > .grow` панели). */
var SP = '<div class="grow"></div>';

   а он ровно то, ради чего лог и показан. */
function logPush(el, lines){
  if (!el || !lines || !lines.length) return;
  el.insertAdjacentHTML('beforeend', lines.map(function(s){
    var t = esc(s);
    var c = {'[ OK ]': 'wzl-ok', '[WARN]': 'wzl-wr', '[FAIL]': 'wzl-bad'}[t.slice(0, 6)];
    if (c) return '<span class="' + c + '">' + t.slice(0, 6) + '</span>' + t.slice(6);
    if (t.slice(0, 3) === '===') return '<span class="wzl-sec">' + t + '</span>';
    return t;
  }).join('\n') + '\n');

function kb(n){ /* КБ у агента; человеку — мегабайты, как их показывает и панель. */
  if (n == null) return '—';
  if (n < 1024) return n + T(' КБ', ' KB');
  /* Разделитель дробной части — часть языка, а не оформления: 1,4 МБ по-русски и 1.4 MB
     по-английски. Смешать их значит написать число, которое читается как опечатка. */
  var m = (n / 1024).toFixed(1);
  return T(m.replace('.', ',') + ' МБ', m + ' MB'); }
/* Байты — отдельной кистью от kb(). Тот принимает КИЛОбайты (в них агент меряет payload) и
   выше мегабайтов не поднимается; накопители же бывают на десятки гигабайт, и «31234,5 МБ»
   читается как опечатка, а не как размер. Разделитель дробной части — часть языка, как и в kb(). */
function hb(b){
  var v = Number(b);
  if (!(v > 0)) return '—';
  var u = v / 1048576, big = u >= 1024;
  if (big) u = u / 1024;
  var s = u.toFixed(1);
  return T(s.replace('.', ',') + (big ? ' ГБ' : ' МБ'), s + (big ? ' GB' : ' MB')); }

/* ПЕРЕРИСОВКА СМЕНОЙ ЯЗЫКА — НЕ ВХОД НА ЭКРАН (`REPAINT`). Экран с данными роутера рисуется из того, что уже знает
   сеанс, и задания НЕ зовёт: до шага 8b смена языка на «Удалить» заново слала план снятия — а он кладёт на роутер свежий
   uninstall.sh, — и итог удаления исчезал, возвращая плитки и красную кнопку (ревью шага 8b). */
var REPAINT = false;
function setLang(v){
  if (v === LANG || langLocked()) return;
  var big = document.activeElement && document.activeElement.closest && document.activeElement.closest('#langbig');
  LANG = v;
  try { localStorage.setItem('enodia_lang', LANG); } catch (e) {}
  paintChrome();
  REPAINT = true;
  try { if (CUR) render(CUR); } finally { REPAINT = false; }
  /* Переключатель на заставке живёт внутри экрана — его перерисовал render: фокус — на выбранный язык. */
  if (big){ var n = document.querySelector('#langbig [data-lang="' + v + '"]'); if (n) n.focus(); }
}
/* Чип в шапке ХРАНИТ, что показывает, а не только показывает: смена языка обязана
   перерисовать и его, а спрашивать агента заново ради строчки незачем. */
var ENV = {k: 'boot', v: null};
function paintEnv(){
  var e = document.getElementById('wz-env');
  if (!e) return;
  /* Цвет чипа — состояние агента (макет `wz-*`): жив — зелёный, молчит — красный, ждём — нейтральный. */
  e.className = 'chip' + (ENV.k === 'ok' ? ' acc' : (ENV.k === 'dead' || ENV.k === 'nokey' ? ' bd' : ''));
  if (ENV.k === 'ok') e.textContent = T('агент ', 'agent ') + ENV.v.version + ' · Python ' + ENV.v.python;
  else if (ENV.k === 'dead') e.textContent = T('агент не отвечает', 'agent is not responding');
  else if (ENV.k === 'bye') e.textContent = T('агент остановлен', 'agent stopped');
  else if (ENV.k === 'nokey') e.textContent = T('у вкладки нет ключа', 'this tab has no key');
  else e.textContent = T('агент запускается…', 'starting the agent…');
  paintFoot();
}
/* КОНЕЦ — КНОПКОЙ, А НЕ КОНСОЛЬЮ (30.09.2026): установка у человека только в браузере, и слать его в чёрное окно жать Ctrl+C
   нельзя. Кнопка — здесь, а не на одном экране: закончить можно и после удаления, и после диагностики, и открыв панель с экрана
   «Панель уже стоит». Окно, пока мастер работает, закрывать по-прежнему нельзя — это и говорим. Кнопка — только при ЖИВОМ агенте
   (при молчащем она умеет лишь выдать ошибку), поэтому подвал рисует та же кисть, что и чип агента; после закрытия подвалу
   сказать нечего. */
function paintFoot(){
  var ft = document.getElementById('wz-foot');
  if (!ft) return;
  ft.innerHTML = (CUR === 'bye' || ENV.k === 'bye') ? '' : T(
    'Окно консоли, из которого запущен мастер, не закрывайте, пока он нужен. Закончили — закройте мастер здесь.',
    'Keep the console window the wizard was started from open while you need it. Done? Close the wizard here.') +
    (ENV.k === 'ok' ? ' <button type="button" class="btn sm gh" data-act="bye">' + T('Закрыть мастер', 'Close the wizard') + '</button>' : '');
}

/* ЭКРАН ОБЯЗАН ДЕРЖАТЬ СВОЁ ОБЕЩАНИЕ. До 30.08.2026 он писал «второй раз спрашивать не буду»
   и спрашивал ВСЕГДА: агент отдаёт `have_password` в /api/state, а страница флаг не читала.
   Серверная половина была готова и тогда — `wizard_connect` с ПУСТЫМ паролем берёт сохранённый.
   Поэтому: пароль есть => поля нет вовсе, входим молча.
   АВТОМАТА «вошли и поехали» тут при этом быть не может, и это не перестраховка: на части
   моделей Xiaomi сток возвращает пароль root к заводскому на КАЖДОЙ загрузке (замерено на
   AX3600), то есть сохранённый ЗАКОННО перестаёт подходить. Отказ по паролю обязан ОТКРЫТЬ
   поле, а не оставить человека в тупике «не спрашиваю» — ради этого ST.pwAsked и ветка в
   act('connect'). Флаг живёт в ST, а не в агенте: он про ЭТОТ сеанс, а не про хранилище. */
/* Сохранён ли пароль — для ПРОВЕРЕННОГО адреса: проба отвечает за свой адрес (`have_password`), а `/api/state` — за адрес
   со старта. Без этого вход на другой роутер пробовал чужой пароль и писал «сохранённый не подошёл» (ревью шага 8b,
   круг 3). После F5 пробы нет — тогда ответ агента, но только если его адрес и есть наш. */
function pwStored(){
  var have = (ST.probe && ST.probe.ip === ST.ip && typeof ST.probe.have_password === 'boolean')
    ? ST.probe.have_password : !!(ST.agent && ST.agent.have_password && ST.agent.host === ST.ip);
  return have && !ST.pwAsked;
}
scr('login', {step: 1, t: Lbl('Пароль root', 'Root password'),
 sub: Lbl('Мастер заходит на роутер под root. Пароль лежит в системном хранилище компьютера.',
          'The wizard signs in to the router as root. The password lives in your computer’s system store.'),
 body: function(){
   /* АГЕНТ УЖЕ ВНУТРИ. Перезагрузка вкладки (F5) не рвёт его SSH-сессию, а состояние страницы
      обнуляет — и мастер спрашивал пароль root заново, хотя он ему не нужен (поймано на живом
      стенде 02.09.2026). Ответ берём у агента (`connected` в /api/state), своей памяти о
      подключении у страницы нет и быть не может. */
   /* `!ST.pwAsked` — то же условие, что у pwStored ниже, и по той же причине: если молчаливый
      вход уже НЕ ПОДОШЁЛ, экран обязан открыть поле, а не повторять «пароль не нужен». Без него
      живая когда-то сессия (роутер перезагрузили под нами) превращала экран в тупик. */
   if (ST.agent && ST.agent.connected && ST.agent.host === ST.ip && !ST.pwAsked)
     return Note(T('Мастер уже подключён к ' + esc(ST.ip) + ' — пароль не нужен. Нажмите «Войти».',
                   'The wizard is already connected to ' + esc(ST.ip) + ' — no password needed. Press “Sign in”.'),
                 'ok') + '<div id="res" role="status"></div>';
   if (pwStored())
     return Note(T('Пароль root уже сохранён — второй раз не спрашиваю.', 'The root password is already saved — I will not ask again.') +
                 (REPAINT ? '' : ' ' + T('Захожу на ' + esc(ST.ip) + '…', 'Signing in to ' + esc(ST.ip) + '…')),
                 'info') + '<div id="res" role="status"></div>';
   return Fld('pw', T('Пароль', 'Password'), '',
              {auth: T('Сохранённый пароль не подошёл — введите текущий.',
                       'The saved password did not work — enter the current one.'),
               access: T('Тот, который вы задали на шаге «Доступ».',
                         'The one you set at the “Access” step.'),
               /* Третий случай — «пароль на шаге „Доступ“ ЗАДАТЬ НЕ ВЫШЛО». Он обязан звучать

                  нет, а это ровно тот тупик, ради которого экран и различает причины. */
               kept: T('Пароль root на шаге «Доступ» остался прежним — введите тот, что у вас есть.',
                       'The root password was left unchanged at the “Access” step — enter the one you have.'),
               defroot: T('Сменить пароль на шаге «Доступ» не вышло — сейчас он «root».',
                          'Changing the password at the “Access” step failed — right now it is “root”.')}[ST.pwWhy] ||
              T('После открытия доступа пароль по умолчанию — root.',
                'Once access is open, the default password is root.'), 'password') +
   '<div class="wzgap">' + Note(T('Хранилище — системное: Windows Credential Manager · Keychain · Secret Service. ' +
          'Мастер не отправляет пароль никуда, кроме самого роутера.',
          'The store is the system one: Windows Credential Manager · Keychain · Secret Service. ' +
          'The wizard sends the password nowhere except the router itself.'), 'info') + '</div>' +
   '<div id="res" role="status"></div>';
 },
 acts: [{t: Lbl('Назад', 'Back'), go: 'access', k: 'gh', bk: 1},
        {t: Lbl('Войти', 'Sign in'), act: 'connect', k: 'pri'}],
 enter: function(){
   /* Смена языка — не новый вход (ревью шага 8b, круг 2): исход прошлой попытки рисуем из сеанса, автовход не зовём. */
   if (REPAINT){ var r0 = document.getElementById('res'); if (r0 && ST.connErr) r0.innerHTML = connFailHtml(ST.connErr); }
   else ST.connErr = null;
   if (pwStored()){ if (!REPAINT) act('connect', document.querySelector('[data-act=connect]')); return; }
   var i = document.getElementById('pw');
   /* ПОЛЯ МОЖЕТ НЕ БЫТЬ: у экрана три тела, и одно из них («мастер уже подключён») его не

      которого в документе нет. */
   if (!i) return;
   if (!REPAINT) i.focus();   /* смена языка — не вход: фокус остаётся на переключателе */
   i.addEventListener('keydown', function(e){ if (e.key === 'Enter') act('connect', document.querySelector('#acts [data-act="connect"]')); });
 }});

scr('rootpw', {step: 1, t: Lbl('Смените пароль root', 'Change the root password'),

 enter: function(){

   runJob('/api/facts', {}).then(function(r){

     ST.facts = r.facts;
     showFacts(r.facts);
   }).catch(function(e){ checkStuck(ST.factsErr = {lost: true, error: e.message, http: e.http}); });
 }});

/* Проверка не дала фактов — причина и дорога: назад и «проверить снова». */
function checkStuck(fe){
  var res = document.getElementById('res'), a = document.getElementById('acts');
  if (res) res.innerHTML = Note(fe.lost ? failTxt(T('Не смог проверить: ', 'Could not run the check: '), {message: fe.error, http: fe.http})
                                        : esc(fe.error || T('Проверка не прошла', 'The check did not pass')), 'bad');
  if (a) actsSet('<button class="btn gh" data-go="login" data-bk="1">' + T('Назад', 'Back') + '</button>' + SP +
    '<button class="btn pri" data-act="recheck">' + T('Проверить снова', 'Check again') + '</button>');
}
function showFacts(f){
  var res = document.getElementById('res'), extra = document.getElementById('extra');

  /* Имя тома называет РОУТЕР (facts.mount): на BE10000 флеш поделён на три ubifs, и наш —
     /data/usr, а не /data. Литерал в подписи означал бы «числа с одного тома, имя с другого». */
  var spmp = esc(f.mount || '/data');
  /* Чем занят роутер (facts.busy): строка проверки (t, d) и причина в плашке (n). Словарь собирается при показе — язык выбран. */
  var BUSY = {

    pkg: {t: T('Идёт установка кода', 'A code installation is running'),

          n: T('на роутере ещё идёт установка кода (прежний запуск доработывает сам) — вторая поверх неё перемешала бы наборы файлов.',

    uninst: {t: T('Идёт снятие системы', 'The system is being removed'),
             d: T('отключение или полное удаление ещё не закончились', 'a turn-off or full removal has not finished yet'),
             n: T('на роутере идёт снятие системы — установка поверх него оставила бы половину системы.',

    mode: {t: T('Идёт смена раскладки', 'A layout switch is running'),

                          'only just: payload ' + kb(f.payload_kb) + ' + a reserve of ' + kb(f.reserve_kb) + ' that cannot be used')},
    tight:{mk: 'wr', d: T('меньше, чем payload ' + kb(f.payload_kb) + ' — но UBIFS сжимает, шанс есть',
                          'less than the payload (' + kb(f.payload_kb) + ') — but UBIFS compresses, so it may still fit')},
    none: {mk: 'no', d: T('не влезет даже самый крупный файл (' + kb(f.peak_kb) + ')',

                  d: esc(f.dir) + T(' не записывается: вход не под root?',

    f.net ? {mk: 'ok', t: T('Интернет на роутере', 'Internet on the router'),
             d: T('нужен, чтобы панель потом сама скачала протоколы',
                  'needed so the panel can download the protocols itself later'), v: T('есть', 'yes')}
